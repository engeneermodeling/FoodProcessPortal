<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">Типові потоки в апараті з мішалкою</title>
  <desc id="desc">Осьовий та радіальний потоки показано в осьовому розрізі апарата з перегородками. Осьовий потік нагнітається вниз і повертається біля стінок. Радіальний струмінь утворює верхній та нижній контури циркуляції. Тангенціальний рух показано зверху: рідина рухається по колах навколо вертикального вала.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.tank{fill:#fff;stroke:#94a3b8;stroke-width:3}.shaft{stroke:#334155;stroke-width:8;stroke-linecap:round}.imp{fill:#2563eb}.arrow{stroke:#0f766e;stroke-width:5;fill:none;stroke-linecap:round}.title{fill:#0f172a;font:700 24px Arial}.label{fill:#334155;font:16px Arial}.note{fill:#475569;font:14px Arial}
    </style>
    <marker id="a" viewBox="0 0 12 8" markerWidth="5" markerHeight="4" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="980" height="460" rx="18"/>
  <g transform="translate(55 54)">
    <text x="130" y="0" text-anchor="middle" class="title">Осьовий потік</text>
    <path class="tank" d="M35 35 H225 V280 Q130 335 35 280 Z"/>
    <path d="M44 65H51V265H44ZM209 65H216V265H209Z" fill="#cbd5e1" stroke="#64748b"/>
    <line class="shaft" x1="130" y1="35" x2="130" y2="202"/>
    <path class="imp" d="M85 190 128 204V216L85 202ZM132 190 175 176V188L132 202Z"/>
    <path class="arrow" marker-end="url(#a)" d="M112 98V174"/>
    <path class="arrow" marker-end="url(#a)" d="M148 98V162"/>
    <path class="arrow" marker-end="url(#a)" d="M115 228V261Q115 285 83 278Q67 274 67 246V124Q67 91 112 98"/>
    <path class="arrow" marker-end="url(#a)" d="M145 228V261Q145 285 177 278Q193 274 193 246V124Q193 91 148 98"/>
    <text x="130" y="333" text-anchor="middle" class="note">осьовий розріз з перегородками</text>
    <text x="130" y="365" text-anchor="middle" class="label">пропелер, похилі лопаті</text>
    <text x="130" y="389" text-anchor="middle" class="note">нагнітання вздовж осі вала</text>
  </g>
  <g transform="translate(360 54)">
    <text x="130" y="0" text-anchor="middle" class="title">Радіальний потік</text>
    <path class="tank" d="M35 35 H225 V280 Q130 335 35 280 Z"/>
    <path d="M44 65H51V265H44ZM209 65H216V265H209Z" fill="#cbd5e1" stroke="#64748b"/>
    <line class="shaft" x1="130" y1="35" x2="130" y2="191"/>
    <path class="imp" d="M95 184H165V190H95ZM90 172H101V202H90ZM159 172H170V202H159Z"/>
    <path class="arrow" marker-end="url(#a)" d="M87 187H59"/>
    <path class="arrow" marker-end="url(#a)" d="M173 187H201"/>
    <path class="arrow" marker-end="url(#a)" d="M64 177V112Q64 76 94 83Q115 89 115 124V160"/>
    <path class="arrow" marker-end="url(#a)" d="M196 177V112Q196 76 166 83Q145 89 145 124V160"/>
    <path class="arrow" marker-end="url(#a)" d="M64 197V257Q64 285 94 277Q115 270 115 240V215"/>
    <path class="arrow" marker-end="url(#a)" d="M196 197V257Q196 285 166 277Q145 270 145 240V215"/>
    <text x="130" y="333" text-anchor="middle" class="note">осьовий розріз з перегородками</text>
    <text x="130" y="365" text-anchor="middle" class="label">дискова турбіна, прямі лопаті</text>
    <text x="130" y="389" text-anchor="middle" class="note">струмінь до стінок, два контури</text>
  </g>
  <g transform="translate(665 54)">
    <text x="130" y="0" text-anchor="middle" class="title">Тангенціальний потік</text>
    <circle class="tank" cx="130" cy="174" r="110"/>
    <path d="M130 51V297M7 174H253" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <path d="M30 174H230M30 163V185M230 163V185" stroke="#2563eb" stroke-width="8" fill="none"/>
    <circle cx="130" cy="174" r="9" fill="#334155"/>
    <path class="arrow" marker-end="url(#a)" d="M130 90A84 84 0 0 1 214 174"/>
    <path class="arrow" marker-end="url(#a)" d="M214 174A84 84 0 0 1 130 258"/>
    <path class="arrow" marker-end="url(#a)" d="M130 258A84 84 0 0 1 46 174"/>
    <path class="arrow" marker-end="url(#a)" d="M46 174A84 84 0 0 1 130 90"/>
    <text x="130" y="333" text-anchor="middle" class="note">вигляд зверху без перегородок</text>
    <text x="130" y="365" text-anchor="middle" class="label">якірна, рамна</text>
    <text x="130" y="389" text-anchor="middle" class="note">рух по дотичній навколо вала</text>
  </g>
</svg>
