<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Лінія очищення і сортування харчової сировини</title>
  <desc id="desc">Послідовність операцій: попереднє очищення, аспірація, просіювання, магнітний сепаратор, оптичне сортування і контроль якості.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Сортування як частина безпечної лінії</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="46" y="158" width="126" height="72" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="72" y="188" fill="#f8fafc" font-weight="700">сировина</text>
    <text x="68" y="212" fill="#94a3b8">зерно, горіхи</text>
    <path d="M174 194h54" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="234" y="158" width="126" height="72" rx="12" fill="#164e63" stroke="#22d3ee"/>
    <text x="266" y="188" fill="#ecfeff" font-weight="700">аспірація</text>
    <text x="260" y="212" fill="#a5f3fc">пил, легкі домішки</text>
    <path d="M362 194h54" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="422" y="158" width="126" height="72" rx="12" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="452" y="188" fill="#eff6ff" font-weight="700">сита</text>
    <text x="442" y="212" fill="#bfdbfe">розмір фракцій</text>
    <path d="M550 194h54" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="610" y="158" width="126" height="72" rx="12" fill="#713f12" stroke="#fbbf24"/>
    <text x="636" y="188" fill="#fffbeb" font-weight="700">магніт</text>
    <text x="628" y="212" fill="#fde68a">металодомішки</text>
    <path d="M738 194h54" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="798" y="158" width="86" height="72" rx="12" fill="#064e3b" stroke="#34d399"/>
    <text x="816" y="188" fill="#ecfdf5" font-weight="700">оптика</text>
    <text x="812" y="212" fill="#bbf7d0">колір</text>
  </g>
  <rect x="78" y="292" width="764" height="56" rx="12" fill="#1f2937" stroke="#374151"/>
  <text x="106" y="326" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16">Окремі апарати не замінюють контроль якості: проби, лабораторія, металодетектор, простежуваність партії.</text>
</svg>
