<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Зони харчового екструдера</title>
  <desc id="desc">Схема екструдера: подача, змішування, стискання, термомеханічна обробка, матриця і різання продукту.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Екструдер поєднує транспортування, змішування і формування</text>
  <g font-family="Arial, sans-serif">
    <rect x="105" y="166" width="630" height="104" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <path d="M145 218h540" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
    <path d="M158 218c30-44 58-44 88 0s58 44 88 0 58-44 88 0 58 44 88 0 58-44 88 0" fill="none" stroke="#fbbf24" stroke-width="7"/>
    <rect x="735" y="184" width="42" height="68" rx="6" fill="#334155" stroke="#60a5fa"/>
    <path d="M777 218h86" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="798" y="198" fill="#dbeafe" font-size="16" font-weight="700">виріб</text>
    <path d="M86 130h96v48" fill="none" stroke="#22c55e" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="58" y="120" fill="#dcfce7" font-size="16" font-weight="700">сировина + вода</text>
    <g fill="#cbd5e1" font-size="15">
      <text x="124" y="310">подача</text>
      <text x="250" y="310">змішування</text>
      <text x="396" y="310">стискання</text>
      <text x="528" y="310">нагрів і зсув</text>
      <text x="722" y="310">матриця</text>
    </g>
    <g stroke="#334155">
      <line x1="220" y1="166" x2="220" y2="270"/>
      <line x1="360" y1="166" x2="360" y2="270"/>
      <line x1="500" y1="166" x2="500" y2="270"/>
      <line x1="650" y1="166" x2="650" y2="270"/>
    </g>
  </g>
  <rect x="72" y="354" width="776" height="42" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="96" y="380" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15">Керують: вологістю, температурою зон, швидкістю шнека, тиском, геометрією матриці і різанням.</text>
</svg>
