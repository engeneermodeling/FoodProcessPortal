<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Механізми агломерації порошків</title>
  <desc id="desc">Частинки порошку об'єднуються у більші агломерати через рідкі містки, липкі поверхні, стискання або кристалізацію розчинених речовин.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Агломерація: дрібні частинки стають більшими</text>
  <text x="42" y="90" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Мета - поліпшити сипкість, змочуваність, розчинення, дозування або транспортування порошку</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="138" width="220" height="172" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="106" y="174" fill="#bfdbfe" font-size="19" font-weight="700">Рідкі містки</text>
    <circle cx="148" cy="230" r="30" fill="#e5e7eb"/>
    <circle cx="216" cy="230" r="30" fill="#e5e7eb"/>
    <path d="M174 230c14-18 28-18 42 0-14 18-28 18-42 0z" fill="#38bdf8" opacity=".75"/>
    <text x="110" y="284" fill="#cbd5e1" font-size="14">вода, пара, розчин зв'язувача</text>

    <rect x="350" y="138" width="220" height="172" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="392" y="174" fill="#bbf7d0" font-size="19" font-weight="700">Стискання</text>
    <circle cx="430" cy="230" r="28" fill="#e5e7eb"/>
    <circle cx="480" cy="230" r="28" fill="#e5e7eb"/>
    <circle cx="455" cy="204" r="26" fill="#d1d5db"/>
    <path d="M404 194h-42M516 194h42" stroke="#22c55e" stroke-width="5"/>
    <path d="M372 194l18-10v20zM548 194l-18-10v20z" fill="#22c55e"/>
    <text x="396" y="284" fill="#cbd5e1" font-size="14">валки, матриця, прес</text>

    <rect x="628" y="138" width="220" height="172" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="662" y="174" fill="#fed7aa" font-size="19" font-weight="700">Кристалізація</text>
    <circle cx="704" cy="230" r="28" fill="#e5e7eb"/>
    <circle cx="766" cy="230" r="28" fill="#e5e7eb"/>
    <g fill="#fbbf24">
      <polygon points="734,210 746,226 730,236 718,220"/>
      <polygon points="742,236 754,252 736,262 724,246"/>
    </g>
    <text x="660" y="284" fill="#cbd5e1" font-size="14">сушіння, цукри, солі, лактоза</text>
  </g>
  <text x="72" y="366" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16">Надмірна агломерація переходить у злежування, грудкування або втрату сипкості.</text>
</svg>
