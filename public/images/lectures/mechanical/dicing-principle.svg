<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Принцип тривимірного нарізання кубиками</title>
  <desc id="desc">Продукт спочатку нарізають на скибку, потім на смуги, потім поперечним ножем на кубики.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Кубик отримують послідовним різанням у трьох напрямах</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="168" width="150" height="90" rx="14" fill="#fbbf24" opacity=".85"/>
    <text x="96" y="148" fill="#fde68a" font-size="17" font-weight="700">цілий продукт</text>
    <path d="M230 214h90" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/>

    <g transform="translate(340 166)">
      <rect x="0" y="0" width="150" height="90" rx="8" fill="#fbbf24" opacity=".75"/>
      <g stroke="#fff7ed" stroke-width="4"><line x1="30" y1="0" x2="30" y2="90"/><line x1="60" y1="0" x2="60" y2="90"/><line x1="90" y1="0" x2="90" y2="90"/><line x1="120" y1="0" x2="120" y2="90"/></g>
    </g>
    <text x="372" y="148" fill="#fde68a" font-size="17" font-weight="700">скибки / смуги</text>
    <path d="M500 214h90" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/>

    <g transform="translate(620 162)" fill="#86efac">
      <rect x="0" y="0" width="26" height="26"/><rect x="38" y="0" width="26" height="26"/><rect x="76" y="0" width="26" height="26"/><rect x="114" y="0" width="26" height="26"/>
      <rect x="0" y="38" width="26" height="26"/><rect x="38" y="38" width="26" height="26"/><rect x="76" y="38" width="26" height="26"/><rect x="114" y="38" width="26" height="26"/>
      <rect x="0" y="76" width="26" height="26"/><rect x="38" y="76" width="26" height="26"/><rect x="76" y="76" width="26" height="26"/><rect x="114" y="76" width="26" height="26"/>
    </g>
    <text x="660" y="148" fill="#bbf7d0" font-size="17" font-weight="700">кубики</text>
  </g>
  <rect x="72" y="344" width="776" height="42" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="96" y="370" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15">Розмір задають товщина скибки, відстань між круглими ножами і крок поперечного різання.</text>
</svg>
