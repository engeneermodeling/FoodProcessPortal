<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Структура лінії фасування та пакування</title>
  <desc id="desc">Потік продукту: подача, дозування, наповнення, запаювання, контроль ваги, інспекція і відбраковка.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Пакувальна лінія - це процесний ланцюг контролю</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="34" y="160" width="112" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="190" fill="#f8fafc" font-weight="700">подача</text>
    <text x="54" y="214" fill="#94a3b8">бункер, насос</text>
    <path d="M148 196h34" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="188" y="160" width="112" height="72" rx="10" fill="#713f12" stroke="#fbbf24"/>
    <text x="214" y="190" fill="#fffbeb" font-weight="700">доза</text>
    <text x="204" y="214" fill="#fde68a">маса/об'єм</text>
    <path d="M302 196h34" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="342" y="160" width="112" height="72" rx="10" fill="#164e63" stroke="#22d3ee"/>
    <text x="364" y="190" fill="#ecfeff" font-weight="700">наповн.</text>
    <text x="360" y="214" fill="#a5f3fc">тара, пакет</text>
    <path d="M456 196h34" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="496" y="160" width="112" height="72" rx="10" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="520" y="190" fill="#eff6ff" font-weight="700">закриття</text>
    <text x="522" y="214" fill="#bfdbfe">шов, кришка</text>
    <path d="M610 196h34" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="650" y="160" width="112" height="72" rx="10" fill="#064e3b" stroke="#34d399"/>
    <text x="672" y="190" fill="#ecfdf5" font-weight="700">контроль</text>
    <text x="666" y="214" fill="#bbf7d0">вага, метал</text>
    <path d="M764 196h34" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="804" y="160" width="84" height="72" rx="10" fill="#581c87" stroke="#c084fc"/>
    <text x="822" y="190" fill="#f3e8ff" font-weight="700">випуск</text>
    <text x="820" y="214" fill="#ddd6fe">партія</text>
  </g>
  <rect x="78" y="306" width="764" height="54" rx="12" fill="#1f2937" stroke="#374151"/>
  <text x="104" y="340" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16">Критичні точки: точність дози, герметичність, маркування, сторонні предмети, відбраковка і простежуваність.</text>
</svg>
