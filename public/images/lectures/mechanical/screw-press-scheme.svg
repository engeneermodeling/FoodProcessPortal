<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Схема шнекового преса</title>
  <desc id="desc">Шнек переміщує матеріал у звуженій камері, тиск зростає, рідина проходить крізь перфоровану оболонку, макуха виходить через регульований зазор.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Шнековий прес: безперервне стискання</text>
  <g font-family="Arial, sans-serif">
    <path d="M168 160h520l70 54-70 54H168z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <path d="M206 214h470" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
    <path d="M220 214c28-48 58-48 86 0s58 48 86 0 58-48 86 0 58 48 86 0 58-48 86 0" fill="none" stroke="#fbbf24" stroke-width="7"/>
    <rect x="176" y="254" width="488" height="30" fill="#334155"/>
    <g stroke="#64748b" stroke-width="2">
      <line x1="206" y1="254" x2="206" y2="284"/><line x1="246" y1="254" x2="246" y2="284"/><line x1="286" y1="254" x2="286" y2="284"/>
      <line x1="326" y1="254" x2="326" y2="284"/><line x1="366" y1="254" x2="366" y2="284"/><line x1="406" y1="254" x2="406" y2="284"/>
      <line x1="446" y1="254" x2="446" y2="284"/><line x1="486" y1="254" x2="486" y2="284"/><line x1="526" y1="254" x2="526" y2="284"/>
      <line x1="566" y1="254" x2="566" y2="284"/><line x1="606" y1="254" x2="606" y2="284"/>
    </g>
    <path d="M76 214h82" stroke="#60a5fa" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="66" y="194" fill="#dbeafe" font-size="17" font-weight="700">підготовлена маса</text>
    <path d="M718 214h100" stroke="#f97316" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="738" y="194" fill="#ffedd5" font-size="17" font-weight="700">макуха</text>
    <path d="M420 286v66" stroke="#22c55e" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="452" y="330" fill="#dcfce7" font-size="17" font-weight="700">відтиснена рідина</text>
    <text x="270" y="128" fill="#cbd5e1" font-size="16">тиск зростає у напрямку виходу</text>
    <path d="M420 132h230" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
