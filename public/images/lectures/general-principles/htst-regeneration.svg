<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Рекуперація тепла у HTST пастеризаторі</title>
  <desc id="desc">Схема показує, як холодне сире молоко нагрівається гарячим пастеризованим молоком у секції регенерації, а зовнішнє тепло додається лише для доведення до температури пастеризації.</desc>
  <defs>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <marker id="arrowCold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#174ea6"/></marker>
    <style>
      .bg{fill:#f8fbff}.unit{fill:#fff;stroke:#8da4c4;stroke-width:3;rx:16}.regen{fill:#ecfdf5;stroke:#22a06b}.heat{fill:#fff7e6;stroke:#e6b450}.cool{fill:#e8f1ff;stroke:#7aa2df}.cold{stroke:#174ea6;stroke-width:6;fill:none;marker-end:url(#arrowCold)}.hot{stroke:#c2410c;stroke-width:6;fill:none;marker-end:url(#arrowHot)}.txt{font-family:Arial,"Helvetica Neue",sans-serif;fill:#102033;font-size:22px}.head{font-size:31px;font-weight:700;fill:#0f2a4f}.label{font-size:24px;font-weight:700}.small{font-size:18px;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="txt head" x="560" y="50" text-anchor="middle">HTST: чому рекуперація економить пару і холод</text>
  <rect class="unit regen" x="250" y="165" width="210" height="145"/>
  <text class="txt label" x="355" y="223" text-anchor="middle">регенерація</text>
  <text class="txt small" x="355" y="254" text-anchor="middle">холодне молоко</text>
  <text class="txt small" x="355" y="282" text-anchor="middle">гріється гарячим</text>
  <rect class="unit heat" x="520" y="165" width="190" height="145"/>
  <text class="txt label" x="615" y="223" text-anchor="middle">нагрівання</text>
  <text class="txt small" x="615" y="254" text-anchor="middle">до 72...75 °C</text>
  <rect class="unit heat" x="770" y="165" width="160" height="145"/>
  <text class="txt label" x="850" y="223" text-anchor="middle">витримка</text>
  <text class="txt small" x="850" y="254" text-anchor="middle">15...20 с</text>
  <rect class="unit cool" x="250" y="385" width="210" height="100"/>
  <text class="txt label" x="355" y="430" text-anchor="middle">охолодження</text>
  <text class="txt small" x="355" y="458" text-anchor="middle">до 4 °C</text>
  <path class="cold" d="M70 235 H245"/>
  <path class="cold" d="M460 235 H515"/>
  <path class="cold" d="M710 235 H765"/>
  <path class="hot" d="M930 235 C1010 235 1010 435 465 435"/>
  <path class="hot" d="M250 435 H95"/>
  <text class="txt small" x="75" y="205">сире молоко 4 °C</text>
  <text class="txt small" x="960" y="205">пастеризоване молоко</text>
  <text class="txt small" x="72" y="475">готовий продукт 4 °C</text>
  <text class="txt label" x="560" y="355" text-anchor="middle">до 90%+ тепла можна повернути у процес</text>
  <text class="txt small" x="560" y="560" text-anchor="middle">Ідея оптимізації проста: гарячий продукт не викидає тепло назовні, а підігріває наступну порцію холодного продукту.</text>
</svg>
