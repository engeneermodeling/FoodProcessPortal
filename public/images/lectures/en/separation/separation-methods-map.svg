<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Selecting a separation method for a heterogeneous food system</title>
  <desc id="desc">The learning diagram shows how particle size, density difference, cake compressibility and heat sensitivity guide selection of settling, filtration, centrifugation or membranes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2454a6"/>
    </marker>
    <style>
      .bg { fill: #f7fbff; }
      .card { fill: #ffffff; stroke: #bfd0e7; stroke-width: 2; rx: 18; }
      .accent { fill: #e8f1ff; stroke: #7aa2df; }
      .food { fill: #fff6df; stroke: #e2b94f; }
      .txt { font-family: Arial, "Helvetica Neue", sans-serif; fill: #102033; font-size: 24px; }
      .small { font-size: 19px; fill: #334155; }
      .head { font-size: 30px; font-weight: 700; fill: #0f2a4f; }
      .label { font-size: 22px; font-weight: 700; fill: #163b71; }
      .arrow { stroke: #2454a6; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { fill: #667085; font-size: 17px; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="620"/>
  <text class="head" x="560" y="52" text-anchor="middle">How to choose a separation method for a food product</text>

  <rect class="card accent" x="380" y="86" width="360" height="92"/>
  <text class="label" x="560" y="122" text-anchor="middle">There is a heterogeneous system</text>
  <text class="small" x="560" y="154" text-anchor="middle">juice, milk, beer, oil, syrup, pulp</text>

  <path class="arrow" d="M560 178 V225"/>
  <rect class="card" x="380" y="225" width="360" height="92"/>
  <text class="label" x="560" y="262" text-anchor="middle">Are particles large?</text>
  <text class="small" x="560" y="294" text-anchor="middle">d &gt; 50 micrometers and Δρ is noticeable</text>

  <path class="arrow" d="M380 270 H230"/>
  <rect class="card food" x="40" y="218" width="190" height="112"/>
  <text class="label" x="135" y="256" text-anchor="middle">Settling</text>
  <text class="small" x="135" y="287" text-anchor="middle">oil/water, wine,</text>
  <text class="small" x="135" y="315" text-anchor="middle">coarse suspensions</text>

  <path class="arrow" d="M560 317 V372"/>
  <rect class="card" x="380" y="372" width="360" height="92"/>
  <text class="label" x="560" y="410" text-anchor="middle">Need more complete separation?</text>
  <text class="small" x="560" y="440" text-anchor="middle">fine particles, emulsions, high capacity</text>

  <path class="arrow" d="M740 418 H890"/>
  <rect class="card food" x="890" y="362" width="190" height="120"/>
  <text class="label" x="985" y="402" text-anchor="middle">Centrifuge</text>
  <text class="small" x="985" y="433" text-anchor="middle">milk, yeast,</text>
  <text class="small" x="985" y="461" text-anchor="middle">juices, oils</text>

  <path class="arrow" d="M560 464 V515"/>
  <rect class="card" x="380" y="515" width="360" height="72"/>
  <text class="label" x="560" y="558" text-anchor="middle">Need clarity or concentration?</text>

  <path class="arrow" d="M380 550 H230"/>
  <rect class="card food" x="40" y="500" width="190" height="96"/>
  <text class="label" x="135" y="535" text-anchor="middle">Filtration</text>
  <text class="small" x="135" y="566" text-anchor="middle">beer, wine, juices,</text>
  <text class="small" x="135" y="590" text-anchor="middle">syrups, oil</text>

  <path class="arrow" d="M740 550 H890"/>
  <rect class="card food" x="890" y="500" width="190" height="96"/>
  <text class="label" x="985" y="535" text-anchor="middle">Membranes</text>
  <text class="small" x="985" y="566" text-anchor="middle">UF/MF/RO for milk,</text>
  <text class="small" x="985" y="590" text-anchor="middle">whey, water, juices</text>

  <text class="muted" x="560" y="608" text-anchor="middle">Start with the simple method, but check product quality, loss of valuable components and CIP cleaning.</text>
</svg>
