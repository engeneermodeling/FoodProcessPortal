<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Dead-end and cross-flow filtration</title>
  <desc id="desc">Comparison of dead-end filtration with cake accumulation and tangential filtration where flow washes the concentration layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#174ea6"/>
    </marker>
    <style>
      .bg { fill: #f8fbff; }
      .panel { fill: #ffffff; stroke: #a7bbd6; stroke-width: 3; rx: 18; }
      .membrane { stroke: #1f3f76; stroke-width: 9; }
      .cake { fill: #e0b45b; opacity: .85; }
      .flow { stroke: #174ea6; stroke-width: 6; fill: none; marker-end: url(#arrow); }
      .permeate { stroke: #28a06b; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .txt { font-family: Arial, "Helvetica Neue", sans-serif; fill: #102033; font-size: 23px; }
      .head { font-size: 30px; font-weight: 700; fill: #0f2a4f; }
      .label { font-size: 25px; font-weight: 700; }
      .small { font-size: 19px; fill: #334155; }
      .dot { fill: #8b5a2b; }
    </style>
  </defs>
  <rect class="bg" width="1080" height="560"/>
  <text class="txt head" x="540" y="48" text-anchor="middle">How cross-flow reduces concentration polarization</text>

  <g transform="translate(60 105)">
    <text class="txt label" x="220" y="-20" text-anchor="middle">Dead-end mode</text>
    <rect class="panel" x="0" y="0" width="440" height="330"/>
    <line class="membrane" x1="80" y1="235" x2="360" y2="235"/>
    <rect class="cake" x="80" y="168" width="280" height="62"/>
    <path class="flow" d="M220 55 V150"/>
    <path class="permeate" d="M160 250 V305"/>
    <path class="permeate" d="M220 250 V305"/>
    <path class="permeate" d="M280 250 V305"/>
    <circle class="dot" cx="145" cy="145" r="8"/><circle class="dot" cx="220" cy="135" r="7"/><circle class="dot" cx="295" cy="150" r="9"/>
    <text class="txt small" x="220" y="374" text-anchor="middle">particles accumulate on the membrane, flux falls quickly</text>
  </g>

  <g transform="translate(580 105)">
    <text class="txt label" x="220" y="-20" text-anchor="middle">Tangential mode</text>
    <rect class="panel" x="0" y="0" width="440" height="330"/>
    <line class="membrane" x1="65" y1="235" x2="375" y2="235"/>
    <rect class="cake" x="80" y="202" width="280" height="25"/>
    <path class="flow" d="M55 130 H375"/>
    <path class="permeate" d="M160 250 V305"/>
    <path class="permeate" d="M220 250 V305"/>
    <path class="permeate" d="M280 250 V305"/>
    <text class="txt small" x="85" y="105">feed</text>
    <text class="txt small" x="285" y="105">retentate</text>
    <text class="txt small" x="220" y="374" text-anchor="middle">recirculation washes the gel layer and stabilizes flux</text>
  </g>
</svg>
