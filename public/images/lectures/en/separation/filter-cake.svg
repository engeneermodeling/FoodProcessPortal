<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Cake filtration</title>
  <desc id="desc">The diagram shows pressurized suspension feed, cake formation on the filter medium and filtrate outlet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#174ea6"/>
    </marker>
    <style>
      .bg { fill: #f8fbff; }
      .unit { fill: #ffffff; stroke: #9fb4d0; stroke-width: 3; rx: 18; }
      .liquid { fill: #d9ecff; }
      .cake { fill: #e0b45b; stroke: #9a6b13; stroke-width: 2; }
      .medium { stroke: #1f3f76; stroke-width: 10; }
      .arrow { stroke: #174ea6; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .txt { font-family: Arial, "Helvetica Neue", sans-serif; fill: #102033; font-size: 24px; }
      .label { font-size: 30px; font-weight: 700; }
      .small { font-size: 20px; fill: #334155; }
      .particle { fill: #8b5a2b; opacity: .85; }
    </style>
  </defs>
  <rect class="bg" width="1040" height="560"/>
  <text class="txt label" x="520" y="48" text-anchor="middle">Filtration with cake formation</text>
  <rect class="unit" x="250" y="105" width="540" height="330"/>
  <rect class="liquid" x="270" y="125" width="260" height="290" rx="8"/>
  <rect class="cake" x="530" y="125" width="92" height="290"/>
  <line class="medium" x1="625" y1="125" x2="625" y2="415"/>
  <rect x="636" y="125" width="134" height="290" fill="#eef8ff"/>

  <line class="arrow" x1="70" y1="270" x2="240" y2="270"/>
  <text class="txt label" x="82" y="238">Suspension</text>
  <text class="txt small" x="82" y="300">p1, solids + liquid</text>

  <line class="arrow" x1="790" y1="270" x2="970" y2="270"/>
  <text class="txt label" x="795" y="238">Filtrate</text>
  <text class="txt small" x="795" y="300">p2, clear liquid</text>

  <text class="txt label" x="576" y="470" text-anchor="middle">cake</text>
  <text class="txt small" x="576" y="500" text-anchor="middle">S grows with time</text>
  <text class="txt label" x="684" y="470" text-anchor="middle">medium</text>
  <text class="txt small" x="684" y="500" text-anchor="middle">resistance R0</text>
  <text class="txt small" x="280" y="80">Driving force: Δp = p1 - p2</text>

  <circle class="particle" cx="315" cy="185" r="8"/>
  <circle class="particle" cx="390" cy="248" r="7"/>
  <circle class="particle" cx="458" cy="320" r="9"/>
  <circle class="particle" cx="340" cy="360" r="6"/>
  <circle class="particle" cx="482" cy="178" r="7"/>
  <circle class="particle" cx="556" cy="184" r="6"/>
  <circle class="particle" cx="584" cy="245" r="8"/>
  <circle class="particle" cx="550" cy="325" r="7"/>
  <circle class="particle" cx="594" cy="384" r="6"/>
</svg>
