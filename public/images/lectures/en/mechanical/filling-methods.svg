<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Dosing and filling methods</title>
  <desc id="desc">Comparison of volumetric, gravimetric, screw, piston, pump and multihead dosing for different food products.</desc>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">The filling method depends on product rheology</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="152" fill="#bfdbfe" font-size="18" font-weight="700">Volumetric</text>
    <text x="76" y="180" fill="#f8fafc" font-size="15">fixed chamber or cup</text>
    <text x="76" y="202" fill="#94a3b8" font-size="14">groats, granules, stable density</text>
    <rect x="335" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="152" fill="#bbf7d0" font-size="18" font-weight="700">Gravimetric</text>
    <text x="359" y="180" fill="#f8fafc" font-size="15">dose mass control</text>
    <text x="359" y="202" fill="#94a3b8" font-size="14">snacks, biscuits, frozen vegetables</text>
    <rect x="618" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="152" fill="#fed7aa" font-size="18" font-weight="700">Screw</text>
    <text x="642" y="180" fill="#f8fafc" font-size="15">powders and fine bulk solids</text>
    <text x="642" y="202" fill="#94a3b8" font-size="14">flour, spices, dry mixes</text>
    <rect x="52" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="288" fill="#fecaca" font-size="18" font-weight="700">Piston</text>
    <text x="76" y="316" fill="#f8fafc" font-size="15">viscous pastes and sauces</text>
    <text x="76" y="338" fill="#94a3b8" font-size="14">jams, creams, ketchup</text>
    <rect x="335" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="288" fill="#bae6fd" font-size="18" font-weight="700">Pump</text>
    <text x="359" y="316" fill="#f8fafc" font-size="15">liquids, beverages, milk</text>
    <text x="359" y="338" fill="#94a3b8" font-size="14">flow rate, level, mass</text>
    <rect x="618" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="288" fill="#ddd6fe" font-size="18" font-weight="700">Multihead</text>
    <text x="642" y="316" fill="#f8fafc" font-size="15">combination of small portions</text>
    <text x="642" y="338" fill="#94a3b8" font-size="14">chips, sweets, frozen products</text>
  </g>
</svg>
