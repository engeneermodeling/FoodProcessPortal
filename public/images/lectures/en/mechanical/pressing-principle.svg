<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Principle of mechanical pressing</title>
  <desc id="desc">Material is compressed between plates or in a chamber, liquid leaves through drainage, the solid phase compacts into cake or sediment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Pressing: pressure displaces the liquid phase</text>
  <text x="42" y="90" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Goal - obtain juice, oil or a dewatered solid phase without excessive product damage</text>
  <g transform="translate(140 130)">
    <rect x="170" y="80" width="300" height="116" rx="10" fill="#92400e" opacity=".88"/>
    <g fill="#fef3c7" opacity=".9">
      <circle cx="210" cy="118" r="10"/><circle cx="254" cy="152" r="8"/><circle cx="310" cy="120" r="9"/>
      <circle cx="362" cy="160" r="10"/><circle cx="424" cy="128" r="8"/>
    </g>
    <rect x="152" y="38" width="336" height="38" rx="6" fill="#64748b"/>
    <rect x="152" y="202" width="336" height="38" rx="6" fill="#64748b"/>
    <path d="M320 0v34" stroke="#38bdf8" stroke-width="7" marker-end="url(#arrow)"/>
    <path d="M320 280v-34" stroke="#38bdf8" stroke-width="7" marker-end="url(#arrow)"/>
    <text x="256" y="26" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="700">pressure</text>
    <path d="M488 150h160" stroke="#22c55e" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="532" y="134" fill="#dcfce7" font-family="Arial, sans-serif" font-size="17" font-weight="700">juice / oil / whey</text>
    <path d="M150 150H34" stroke="#f97316" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="22" y="134" fill="#ffedd5" font-family="Arial, sans-serif" font-size="17" font-weight="700">compacted mass</text>
  </g>
  <rect x="76" y="356" width="768" height="42" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="98" y="382" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15">Key variables: pressure, time, temperature, cake permeability, pre-grinding and drainage.</text>
</svg>
