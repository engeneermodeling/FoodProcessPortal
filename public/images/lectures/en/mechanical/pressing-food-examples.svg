<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Examples of pressing in food production</title>
  <desc id="desc">Example map: oilseeds, apple juice, curd mass, pulp, olive paste, wet powders.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Where mechanical pressing is used</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="150" fill="#fde68a" font-size="18" font-weight="700">Oilseeds</text>
    <text x="76" y="178" fill="#f8fafc" font-size="15">sunflower, rapeseed, soy</text>
    <text x="76" y="200" fill="#94a3b8" font-size="14">flaking, conditioning, press</text>

    <rect x="335" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="150" fill="#bbf7d0" font-size="18" font-weight="700">Juices and purees</text>
    <text x="359" y="178" fill="#f8fafc" font-size="15">apples, berries, vegetables</text>
    <text x="359" y="200" fill="#94a3b8" font-size="14">grinding, press, filtration</text>

    <rect x="618" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="150" fill="#bae6fd" font-size="18" font-weight="700">Curd mass</text>
    <text x="642" y="178" fill="#f8fafc" font-size="15">whey removal</text>
    <text x="642" y="200" fill="#94a3b8" font-size="14">gentle pressure and time</text>

    <rect x="52" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="284" fill="#fecaca" font-size="18" font-weight="700">Pulp and pomace</text>
    <text x="76" y="312" fill="#f8fafc" font-size="15">sugar beet, fruits</text>
    <text x="76" y="334" fill="#94a3b8" font-size="14">moisture reduction before drying</text>

    <rect x="335" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="284" fill="#ddd6fe" font-size="18" font-weight="700">Olive paste</text>
    <text x="359" y="312" fill="#f8fafc" font-size="15">oil, water, solid phase</text>
    <text x="359" y="334" fill="#94a3b8" font-size="14">decanter after paste preparation</text>

    <rect x="618" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="284" fill="#fed7aa" font-size="18" font-weight="700">Wet powders</text>
    <text x="642" y="312" fill="#f8fafc" font-size="15">sediments, concentrates</text>
    <text x="642" y="334" fill="#94a3b8" font-size="14">before drying or disposal</text>
  </g>
</svg>
