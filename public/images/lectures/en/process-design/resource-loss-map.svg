<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Resource loss map</title>
  <desc id="desc">Karta typovykh resursnykh vtrat kharchovoi line: product, voda, teplo, kholod, khimiia, pakuvannia.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Every loss has a place, cause and owner</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <g fill="#1e293b" stroke="#475569" stroke-width="2">
      <rect x="84" y="116" width="220" height="88" rx="14"/>
      <rect x="350" y="116" width="220" height="88" rx="14"/>
      <rect x="616" y="116" width="220" height="88" rx="14"/>
      <rect x="84" y="244" width="220" height="88" rx="14"/>
      <rect x="350" y="244" width="220" height="88" rx="14"/>
      <rect x="616" y="244" width="220" height="88" rx="14"/>
    </g>
    <text x="134" y="153" fill="#fee2e2">Product</text>
    <text x="116" y="180" fill="#cbd5e1" font-size="14">startup, shutdown, rejects</text>
    <text x="414" y="153" fill="#dbeafe">Water</text>
    <text x="383" y="180" fill="#cbd5e1" font-size="14">CIP, rinsing</text>
    <text x="682" y="153" fill="#fef3c7">Heat</text>
    <text x="653" y="180" fill="#cbd5e1" font-size="14">steam, condensate</text>
    <text x="150" y="281" fill="#cffafe">Cold</text>
    <text x="116" y="308" fill="#cbd5e1" font-size="14">cooling, losses</text>
    <text x="407" y="281" fill="#e0e7ff">Chemistry</text>
    <text x="380" y="308" fill="#cbd5e1" font-size="14">cleaning agents</text>
    <text x="670" y="281" fill="#dcfce7">Packaging</text>
    <text x="650" y="308" fill="#cbd5e1" font-size="14">film, container, label</text>
  </g>
</svg>
