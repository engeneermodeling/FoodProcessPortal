<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Food stream use hierarchy</title>
  <desc id="desc">Skhema priorytetiv: zapobihannia vtratam, kharchove vykorystannia, korm, promyslova pererobka, enerhiia, utylizatsiia.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">The best waste is the waste that never appears</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="210" y="92" width="500" height="46" rx="10" fill="#14532d"/><text x="350" y="122" fill="#dcfce7">Loss prevention</text>
    <rect x="250" y="150" width="420" height="46" rx="10" fill="#166534"/><text x="344" y="180" fill="#dcfce7">Food use</text>
    <rect x="290" y="208" width="340" height="46" rx="10" fill="#854d0e"/><text x="387" y="238" fill="#fef3c7">Feed / ingredients</text>
    <rect x="330" y="266" width="260" height="46" rx="10" fill="#7c2d12"/><text x="374" y="296" fill="#ffedd5">Industrial processing</text>
    <rect x="370" y="324" width="180" height="46" rx="10" fill="#7f1d1d"/><text x="413" y="354" fill="#fee2e2">Disposal</text>
  </g>
</svg>
