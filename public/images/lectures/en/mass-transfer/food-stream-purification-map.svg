<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Applications of absorption and adsorption in food processing</title>
  <desc id="desc">Map of typical streams: odorous air, process water, syrups, beverages, refrigeration gases and ventilation.</desc>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Where this appears in a food plant</text>
  <text x="42" y="90" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Absorption works through dissolution in liquid, adsorption through the surface of a solid sorbent</text>

  <g font-family="Arial, sans-serif">
    <rect x="42" y="128" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="64" y="160" fill="#bfdbfe" font-size="18" font-weight="700">Ventilation air</text>
    <text x="64" y="188" fill="#f8fafc" font-size="15">odours, VOC, fat vapours</text>
    <text x="64" y="210" fill="#94a3b8" font-size="14">adsorber or biofilter</text>

    <rect x="335" y="128" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="357" y="160" fill="#bbf7d0" font-size="18" font-weight="700">Syrups and beverages</text>
    <text x="357" y="188" fill="#f8fafc" font-size="15">colour, off-flavours, impurities</text>
    <text x="357" y="210" fill="#94a3b8" font-size="14">activated carbon</text>

    <rect x="628" y="128" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="650" y="160" fill="#fde68a" font-size="18" font-weight="700">Refrigeration systems</text>
    <text x="650" y="188" fill="#f8fafc" font-size="15">emergency NH3 releases</text>
    <text x="650" y="210" fill="#94a3b8" font-size="14">water or acid scrubber</text>

    <rect x="42" y="258" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="64" y="290" fill="#bae6fd" font-size="18" font-weight="700">Process water</text>
    <text x="64" y="318" fill="#f8fafc" font-size="15">organics, odour, organochlorines</text>
    <text x="64" y="340" fill="#94a3b8" font-size="14">granular sorbent</text>

    <rect x="335" y="258" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="357" y="290" fill="#fecaca" font-size="18" font-weight="700">Gas mixtures</text>
    <text x="357" y="318" fill="#f8fafc" font-size="15">CO2, SO2, H2S, NH3</text>
    <text x="357" y="340" fill="#94a3b8" font-size="14">absorption column</text>

    <rect x="628" y="258" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="650" y="290" fill="#ddd6fe" font-size="18" font-weight="700">Oils and extracts</text>
    <text x="650" y="318" fill="#f8fafc" font-size="15">pigments, solvent traces</text>
    <text x="650" y="340" fill="#94a3b8" font-size="14">sorption + filtration</text>
  </g>
</svg>
