<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Rectification column</title>
  <desc id="desc">Column diagram with reboiler, condenser, reflux, distillate, feed, rising vapour and descending liquid.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.col{fill:#fff;stroke:#1e293b;stroke-width:4}.tray{stroke:#64748b;stroke-width:3}.boil{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.cond{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.vap{stroke:#7c3aed;stroke-width:5;fill:none;marker-end:url(#v)}.liq{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#l)}.feed{stroke:#ea580c;stroke-width:5;fill:none;marker-end:url(#f)}.prod{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#p)}.h{fill:#0f172a;font:700 22px Arial}.t{fill:#334155;font:16px Arial}.small{fill:#475569;font:14px Arial}
    </style>
    <marker id="v" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="l" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#0f766e"/></marker>
    <marker id="f" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#ea580c"/></marker>
    <marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="980" height="560" rx="18"/>
  <text x="490" y="42" text-anchor="middle" class="h">Rectification repeatedly contacts vapour and liquid, increasing separation purity</text>
  <rect x="390" y="95" width="200" height="330" rx="28" class="col"/>
  <g>
    <line class="tray" x1="410" y1="145" x2="570" y2="145"/>
    <line class="tray" x1="410" y1="190" x2="570" y2="190"/>
    <line class="tray" x1="410" y1="235" x2="570" y2="235"/>
    <line class="tray" x1="410" y1="280" x2="570" y2="280"/>
    <line class="tray" x1="410" y1="325" x2="570" y2="325"/>
    <line class="tray" x1="410" y1="370" x2="570" y2="370"/>
  </g>
  <rect x="360" y="435" width="260" height="70" rx="16" class="boil"/>
  <text x="490" y="479" text-anchor="middle" class="h">reboiler</text>
  <rect x="635" y="85" width="210" height="70" rx="16" class="cond"/>
  <text x="740" y="128" text-anchor="middle" class="h">condenser</text>
  <path class="feed" d="M130 260 H390"/>
  <text x="145" y="240" class="t">feed</text>
  <path class="vap" d="M465 430 V115"/>
  <path class="liq" d="M525 105 V415"/>
  <path class="vap" d="M590 115 H635"/>
  <path class="prod" d="M845 120 H930"/>
  <text x="858" y="102" class="t">distillate</text>
  <path class="liq" d="M635 150 C615 190 575 190 550 165"/>
  <text x="610" y="205" class="small">reflux</text>
  <path class="prod" d="M490 505 V540 H720"/>
  <text x="615" y="535" class="t">bottoms</text>
  <text x="285" y="335" class="t" fill="#7c3aed">vapour upward</text>
  <text x="600" y="345" class="t" fill="#0f766e">liquid downward</text>
</svg>
