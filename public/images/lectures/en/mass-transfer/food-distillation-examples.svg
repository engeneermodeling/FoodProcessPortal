<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Food applications of distillation and rectification</title>
  <desc id="desc">Application map: alcohol mixtures, dealcoholization, essential oils, aroma distillates, solvent recovery.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.core{fill:#7c3aed}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.line{stroke:#94a3b8;stroke-width:3;fill:none}.h{fill:#0f172a;font:700 21px Arial}.coreText{fill:#fff;font:700 28px Arial}.t{fill:#334155;font:16px Arial}
    </style>
  </defs>
