<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Bernoulli equation as a head balance</title>
  <desc id="desc">A pipe with two sections shows elevation, pressure and velocity heads, plus losses between sections.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#174ea6"/></marker>
    <style>
      .bg{fill:#f8fbff}.pipe{fill:none;stroke:#8da4c4;stroke-width:38;stroke-linecap:round}.core{fill:none;stroke:#d8ecff;stroke-width:24;stroke-linecap:round}.flow{stroke:#174ea6;stroke-width:5;fill:none;marker-end:url(#arrow)}.datum{stroke:#64748b;stroke-width:3;stroke-dasharray:10 8}.headline{stroke:#ef4444;stroke-width:4;stroke-dasharray:9 7}.txt{font-family:Arial,"Helvetica Neue",sans-serif;fill:#102033;font-size:23px}.head{font-size:31px;font-weight:700;fill:#0f2a4f}.label{font-size:25px;font-weight:700}.small{font-size:19px;fill:#334155}.box{fill:#fff;stroke:#bfd0e7;stroke-width:2;rx:14}
    </style>
  </defs>
  <rect class="bg" width="1080" height="600"/>
  <text class="txt head" x="540" y="50" text-anchor="middle">Bernoulli: flow energy in meters of head</text>
  <line class="datum" x1="110" y1="500" x2="970" y2="500"/>
  <text class="txt small" x="125" y="528">reference level z = 0</text>
  <path class="pipe" d="M135 380 C280 380 330 320 455 320 C575 320 610 235 750 235 C835 235 900 250 950 250"/>
  <path class="core" d="M135 380 C280 380 330 320 455 320 C575 320 610 235 750 235 C835 235 900 250 950 250"/>
  <path class="flow" d="M180 378 C305 372 340 320 452 320"/>
  <path class="flow" d="M560 302 C620 248 680 235 760 235"/>
  <line class="headline" x1="250" y1="160" x2="840" y2="110"/>
  <line x1="275" y1="380" x2="275" y2="500" stroke="#2563eb" stroke-width="4"/>
  <line x1="740" y1="235" x2="740" y2="500" stroke="#2563eb" stroke-width="4"/>
  <text class="txt label" x="250" y="410">1</text>
  <text class="txt label" x="760" y="265">2</text>
  <rect class="box" x="105" y="88" width="340" height="118"/>
  <text class="txt label" x="275" y="125" text-anchor="middle">z + p/(ρg) + w²/(2g)</text>
  <text class="txt small" x="275" y="158" text-anchor="middle">elevation + pressure + velocity</text>
  <text class="txt small" x="275" y="186" text-anchor="middle">all in meters of liquid column</text>
  <rect class="box" x="645" y="360" width="320" height="92"/>
  <text class="txt label" x="805" y="397" text-anchor="middle">h_loss</text>
  <text class="txt small" x="805" y="426" text-anchor="middle">friction, elbows, valves, filters</text>
  <text class="txt small" x="540" y="562" text-anchor="middle">In a real food pipeline total head decreases, so the pump must compensate elevation, pressure and losses.</text>
</svg>
