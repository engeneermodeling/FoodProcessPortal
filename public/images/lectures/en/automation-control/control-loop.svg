<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Closed control loop</title>
  <desc id="desc">Diagram of a sensor, controller, actuator and process in a closed control loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Closed loop: measure, compare, act</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="72" y="172" width="150" height="88" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="112" y="212" fill="#f8fafc">setpoint</text>
    <text x="108" y="236" fill="#cbd5e1" font-size="14">SP</text>
    <path d="M228 216h70" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="310" y="172" width="150" height="88" rx="14" fill="#312e81" stroke="#6366f1"/>
    <text x="342" y="212" fill="#e0e7ff">controller</text>
    <text x="350" y="236" fill="#c7d2fe" font-size="14">PID / logic</text>
    <path d="M466 216h70" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="548" y="172" width="150" height="88" rx="14" fill="#854d0e" stroke="#f59e0b"/>
    <text x="578" y="212" fill="#fef3c7">valve</text>
    <text x="572" y="236" fill="#fde68a" font-size="14">pump, heater</text>
    <path d="M704 216h70" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="786" y="172" width="98" height="88" rx="14" fill="#14532d" stroke="#22c55e"/>
    <text x="808" y="212" fill="#dcfce7">process</text>
  </g>
  <path d="M835 268v78H150v-78" fill="none" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="376" y="318" width="180" height="58" rx="12" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="418" y="354" fill="#dbeafe" font-family="Arial, sans-serif" font-size="17" font-weight="700">PV sensor</text>
</svg>
