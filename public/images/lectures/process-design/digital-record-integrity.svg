<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Цілісність цифрових записів</title>
  <desc id="desc">Схема вимог до цифрових записів: доступ, час, зміни, резервна копія і читабельність.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Цифровий запис має бути надійним доказом процесу</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <circle cx="460" cy="220" r="82" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
    <text x="407" y="214" fill="#dbeafe" font-size="19">Запис</text>
    <text x="384" y="239" fill="#dbeafe" font-size="19">партії/процесу</text>
    <g font-size="15" fill="#f8fafc">
      <rect x="66" y="120" width="190" height="64" rx="13" fill="#164e63" stroke="#06b6d4"/>
      <text x="104" y="158">Доступ і ролі</text>
      <rect x="664" y="120" width="190" height="64" rx="13" fill="#14532d" stroke="#22c55e"/>
      <text x="705" y="158">Audit trail</text>
      <rect x="66" y="270" width="190" height="64" rx="13" fill="#854d0e" stroke="#f59e0b"/>
      <text x="106" y="308">Час і зона</text>
      <rect x="664" y="270" width="190" height="64" rx="13" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="696" y="308">Backup/restore</text>
    </g>
    <g stroke="#38bdf8" stroke-width="3">
      <path d="M256 152 L379 194"/>
      <path d="M664 152 L541 194"/>
      <path d="M256 302 L379 246"/>
      <path d="M664 302 L541 246"/>
    </g>
  </g>
</svg>
