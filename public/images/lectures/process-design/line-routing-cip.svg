<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
  <title id="title">Маршрути продукту і CIP</title>
  <desc id="desc">Схема розділення маршрутів продукту, CIP-розчинів і дренажу через клапанний вузол.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="920" height="450" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">У схемі мають бути видні маршрути продукту і CIP</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="76" y="132" width="140" height="70" rx="14" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="108" y="174" fill="#dbeafe" font-size="17">танк продукту</text>
    <rect x="76" y="272" width="140" height="70" rx="14" fill="#14532d" stroke="#22c55e"/>
    <text x="106" y="314" fill="#dcfce7" font-size="17">CIP-станція</text>
    <rect x="386" y="190" width="150" height="92" rx="16" fill="#1e293b" stroke="#818cf8"/>
    <text x="416" y="232" fill="#e0e7ff" font-size="19">клапанний</text>
    <text x="430" y="258" fill="#e0e7ff" font-size="19">вузол</text>
    <rect x="704" y="132" width="140" height="70" rx="14" fill="#854d0e" stroke="#f59e0b"/>
    <text x="744" y="174" fill="#fef3c7" font-size="17">лінія</text>
    <rect x="704" y="272" width="140" height="70" rx="14" fill="#7f1d1d" stroke="#ef4444"/>
    <text x="744" y="314" fill="#fee2e2" font-size="17">дренаж</text>
    <path d="M218 167h164" stroke="#38bdf8" stroke-width="7" marker-end="url(#arrowBlue)"/>
    <path d="M538 218c74-2 116-18 164-48" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#arrowBlue)"/>
    <path d="M218 307h120c46 0 50-58 48-70" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#arrowGreen)"/>
    <path d="M538 254c74 8 114 30 164 52" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#arrowGreen)"/>
  </g>
  <rect x="150" y="380" width="620" height="42" rx="10" fill="#1f2937" stroke="#475569"/>
  <text x="182" y="406" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15">Критично: продукт, CIP і дренаж не повинні змішуватися неконтрольовано.</text>
</svg>
