<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Окупність і чутливість</title>
  <desc id="desc">Схема простого розрахунку окупності та факторів, які змінюють економічний результат.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Окупність залежить від реальних річних заощаджень</text>
  <g font-family="Arial, sans-serif">
    <rect x="92" y="142" width="250" height="110" rx="16" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="132" y="185" fill="#dbeafe" font-size="22" font-weight="700">інвестиція</text>
    <text x="126" y="216" fill="#bfdbfe" font-size="15">додатковий CAPEX</text>
    <rect x="578" y="142" width="250" height="110" rx="16" fill="#14532d" stroke="#22c55e"/>
    <text x="620" y="185" fill="#dcfce7" font-size="22" font-weight="700">економія/рік</text>
    <text x="610" y="216" fill="#bbf7d0" font-size="15">енергія + продукт + простої</text>
    <path d="M348 197h224" stroke="#38bdf8" stroke-width="6"/>
    <text x="370" y="178" fill="#f8fafc" font-size="18" font-weight="700">окупність = CAPEX / savings</text>
    <rect x="170" y="316" width="580" height="52" rx="12" fill="#1f2937" stroke="#475569"/>
    <text x="202" y="348" fill="#f8fafc" font-size="15">Чутливість: ціна енергії, обсяг виробництва, втрати продукту, простої, ремонт.</text>
  </g>
</svg>
