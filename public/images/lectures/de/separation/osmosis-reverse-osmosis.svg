<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Osmose und Umkehrosmose</title>
  <desc id="desc">Drei Systemzustaende: natuerliche Osmose, Gleichgewicht beim osmotischen Druck und Umkehrosmose, wenn der angelegte Druck den osmotischen Druck uebersteigt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#174ea6"/>
    </marker>
    <style>
      .bg { fill: #f8fbff; }
      .cell { fill: #ffffff; stroke: #a7bbd6; stroke-width: 3; rx: 18; }
      .water { fill: #d8ecff; }
      .solution { fill: #fff1c7; }
      .membrane { stroke: #1f3f76; stroke-width: 8; stroke-dasharray: 10 10; }
      .arrow { stroke: #174ea6; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .pressure { stroke: #c2410c; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .txt { font-family: Arial, "Helvetica Neue", sans-serif; fill: #102033; font-size: 22px; }
      .head { font-size: 30px; font-weight: 700; fill: #0f2a4f; }
      .label { font-size: 24px; font-weight: 700; }
      .small { font-size: 18px; fill: #334155; }
    </style>
  </defs>
  <rect class="bg" width="1080" height="600"/>
  <text class="txt head" x="540" y="48" text-anchor="middle">Osmose, Gleichgewicht und Umkehrosmose</text>

  <g transform="translate(45 105)">
    <text class="txt label" x="155" y="-20" text-anchor="middle">1. Osmose</text>
    <rect class="cell" x="0" y="0" width="310" height="300"/>
    <rect class="water" x="15" y="15" width="137" height="270" rx="12"/>
    <rect class="solution" x="158" y="15" width="137" height="270" rx="12"/>
    <line class="membrane" x1="155" y1="15" x2="155" y2="285"/>
    <path class="arrow" d="M70 155 H235"/>
    <text class="txt small" x="75" y="72">Wasser</text>
    <text class="txt small" x="190" y="72">Loesung</text>
    <text class="txt small" x="155" y="335" text-anchor="middle">Loesungsmittel wandert in konzentrierte Loesung</text>
  </g>

  <g transform="translate(385 105)">
    <text class="txt label" x="155" y="-20" text-anchor="middle">2. Gleichgewicht</text>
    <rect class="cell" x="0" y="0" width="310" height="300"/>
    <rect class="water" x="15" y="15" width="137" height="270" rx="12"/>
    <rect class="solution" x="158" y="15" width="137" height="270" rx="12"/>
    <line class="membrane" x1="155" y1="15" x2="155" y2="285"/>
    <path class="pressure" d="M260 35 V120"/>
    <text class="txt label" x="275" y="35">π</text>
    <text class="txt small" x="155" y="335" text-anchor="middle">Osmose stoppt beim Druck π</text>
  </g>

  <g transform="translate(725 105)">
    <text class="txt label" x="155" y="-20" text-anchor="middle">3. Umkehrosmose</text>
    <rect class="cell" x="0" y="0" width="310" height="300"/>
    <rect class="water" x="15" y="15" width="137" height="270" rx="12"/>
    <rect class="solution" x="158" y="15" width="137" height="270" rx="12"/>
    <line class="membrane" x1="155" y1="15" x2="155" y2="285"/>
    <path class="pressure" d="M260 20 V135"/>
    <text class="txt label" x="270" y="28">p &gt; π</text>
    <path class="arrow" d="M250 155 H85"/>
    <text class="txt small" x="155" y="335" text-anchor="middle">Druck zwingt Wasser zurueck</text>
  </g>

  <text class="txt small" x="540" y="548" text-anchor="middle">Bei RO ist die Treibkraft etwa p - Δπ; mit steigender Konzentration braucht man hoeheren Druck.</text>
</svg>
