<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc">
  <title id="title">Hydrostatischer Druck im Behaelter</title>
  <desc id="desc">Das Behaelterschema zeigt: der Druck steigt mit der Tiefe nach p gleich p0 plus rho g h.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#174ea6"/></marker>
    <style>
      .bg{fill:#f8fbff}.tank{fill:#fff;stroke:#8da4c4;stroke-width:4}.liquid{fill:#d8ecff}.axis{stroke:#174ea6;stroke-width:4;marker-end:url(#arrow)}.gauge{fill:#fff7e6;stroke:#e6b450;stroke-width:3}.txt{font-family:Arial,"Helvetica Neue",sans-serif;fill:#102033;font-size:23px}.head{font-size:31px;font-weight:700;fill:#0f2a4f}.label{font-size:25px;font-weight:700}.small{font-size:19px;fill:#334155}.pressure{stroke:#2563eb;stroke-width:5}
    </style>
  </defs>
  <rect class="bg" width="1040" height="580"/>
  <text class="txt head" x="520" y="50" text-anchor="middle">Hydrostatik: Druck steigt mit Tiefe</text>
  <rect class="tank" x="210" y="105" width="360" height="360" rx="16"/>
  <rect class="liquid" x="230" y="175" width="320" height="270" rx="8"/>
  <path d="M235 180 C280 160 330 195 380 178 C430 160 490 190 545 174" fill="none" stroke="#9cccf0" stroke-width="5"/>
  <line class="axis" x1="610" y1="175" x2="610" y2="445"/>
  <text class="txt label" x="632" y="315">h</text>
  <line class="pressure" x1="230" y1="235" x2="300" y2="235"/>
  <line class="pressure" x1="230" y1="330" x2="390" y2="330"/>
  <line class="pressure" x1="230" y1="420" x2="510" y2="420"/>
  <text class="txt small" x="118" y="240">kleiner Druck</text>
  <text class="txt small" x="92" y="336">groesserer Druck</text>
  <text class="txt small" x="70" y="426">groesster Druck</text>
  <circle class="gauge" cx="710" cy="425" r="46"/>
  <path d="M682 425 H738" stroke="#102033" stroke-width="4"/>
  <path d="M710 425 L735 403" stroke="#ef4444" stroke-width="4"/>
  <text class="txt small" x="710" y="493" text-anchor="middle">Fuellstandsensor</text>
  <text class="txt label" x="720" y="205">p = p₀ + ρgh</text>
  <text class="txt small" x="720" y="245">Das Manometer unten sieht das Gewicht der Fluessigkeitssaeule.</text>
  <text class="txt small" x="720" y="275">So funktioniert eine hydrostatische Fuellstandmessung.</text>
  <text class="txt small" x="520" y="535" text-anchor="middle">Bei Milch, Saft oder Sirup rechnet der Regler Druck in Fuellstand um; die Dichte muss bekannt oder kompensiert sein.</text>
</svg>
