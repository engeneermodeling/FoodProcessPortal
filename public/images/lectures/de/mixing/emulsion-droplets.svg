<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Einfluss der Mischintensitaet auf Emulsionstropfen</title>
  <desc id="desc">Geringe Scherung erzeugt grosse Tropfen; ausreichende Scherung und Stabilisator bilden eine feinere stabile Emulsion.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.water{fill:#dbeafe}.oil{fill:#fbbf24;stroke:#b45309;stroke-width:2}.arrow{stroke:#7c3aed;stroke-width:6;fill:none;marker-end:url(#a)}.h{fill:#0f172a;font:700 22px Arial}.t{fill:#334155;font:16px Arial}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="bg" width="980" height="430" rx="18"/>
  <rect class="panel" x="70" y="80" width="320" height="250" rx="14"/>
  <rect class="water" x="95" y="122" width="270" height="150" rx="16"/>
  <circle class="oil" cx="160" cy="192" r="42"/><circle class="oil" cx="265" cy="180" r="34"/>
  <text x="230" y="50" text-anchor="middle" class="h">Unzureichende Scherung</text>
  <text x="230" y="365" text-anchor="middle" class="t">grosse Tropfen koaleszieren schnell</text>
  <path class="arrow" d="M430 205 H550"/>
  <rect class="panel" x="590" y="80" width="320" height="250" rx="14"/>
  <rect class="water" x="615" y="122" width="270" height="150" rx="16"/>
  <circle class="oil" cx="665" cy="160" r="16"/><circle class="oil" cx="720" cy="210" r="13"/><circle class="oil" cx="780" cy="170" r="15"/><circle class="oil" cx="835" cy="225" r="12"/><circle class="oil" cx="850" cy="155" r="10"/><circle class="oil" cx="690" cy="240" r="11"/>
  <text x="750" y="50" text-anchor="middle" class="h">Ausreichende Scherung + Stabilisator</text>
  <text x="750" y="365" text-anchor="middle" class="t">feinere Tropfen, hoehere Stabilitaet</text>
</svg>
