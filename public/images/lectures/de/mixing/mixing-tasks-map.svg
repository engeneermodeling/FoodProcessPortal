<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Aufgaben des Mischens in der Lebensmittelherstellung</title>
  <desc id="desc">Der zentrale Mischblock ist mit Loesen, Suspendieren, Emulgieren, Waermeuebergang, Gas-Fluessig-Dispergieren und Homogenisieren verbunden.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.line{stroke:#64748b;stroke-width:3;fill:none}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.core{fill:#6d28d9}.coreText{fill:#fff;font:700 30px Arial}.h{fill:#0f172a;font:700 20px Arial}.t{fill:#334155;font:16px Arial}.small{fill:#475569;font:14px Arial}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="980" height="560" rx="18"/>
  <rect x="365" y="220" width="250" height="120" rx="18" class="core"/>
  <text x="490" y="270" text-anchor="middle" class="coreText">Mischen</text>
  <text x="490" y="304" text-anchor="middle" class="small" fill="#ede9fe">das Ziel bestimmt den Ruehrertyp</text>
  <path class="line" marker-end="url(#arrow)" d="M365 250 C265 210 230 160 185 112"/>
  <path class="line" marker-end="url(#arrow)" d="M365 300 C260 330 214 382 178 445"/>
  <path class="line" marker-end="url(#arrow)" d="M490 220 C490 160 490 125 490 82"/>
  <path class="line" marker-end="url(#arrow)" d="M615 250 C710 205 750 155 808 110"/>
  <path class="line" marker-end="url(#arrow)" d="M615 300 C725 330 780 380 828 448"/>
  <path class="line" marker-end="url(#arrow)" d="M490 340 C490 395 490 430 490 485"/>
  <rect x="54" y="54" width="250" height="116" rx="12" class="box"/>
  <text x="179" y="91" text-anchor="middle" class="h">Loesen</text>
  <text x="76" y="122" class="t">Zucker, Salz, Trockenmischungen</text>
  <text x="76" y="148" class="small">Zeit und Temperatur sind wichtig</text>
  <rect x="54" y="390" width="250" height="116" rx="12" class="box"/>
  <text x="179" y="427" text-anchor="middle" class="h">Suspendieren</text>
  <text x="76" y="458" class="t">Fruchtmark, Kakao, Gewuerze</text>
  <text x="76" y="484" class="small">Partikel am Absetzen hindern</text>
  <rect x="365" y="34" width="250" height="116" rx="12" class="box"/>
  <text x="490" y="71" text-anchor="middle" class="h">Emulgieren</text>
  <text x="387" y="102" class="t">Saucen, Mayonnaise, Milch</text>
  <text x="387" y="128" class="small">Scherung und Stabilisator noetig</text>
  <rect x="676" y="54" width="250" height="116" rx="12" class="box"/>
  <text x="801" y="91" text-anchor="middle" class="h">Waermeuebergang</text>
  <text x="698" y="122" class="t">Kochen, Kuehlen, Pasten</text>
  <text x="698" y="148" class="small">weniger Anbrennen und Totzonen</text>
  <rect x="676" y="390" width="250" height="116" rx="12" class="box"/>
  <text x="801" y="427" text-anchor="middle" class="h">Gas-Fluessig</text>
  <text x="698" y="458" class="t">Aeration, Karbonisierung</text>
  <text x="698" y="484" class="small">Kontrolle von Schaum und Blasen</text>
  <rect x="365" y="410" width="250" height="116" rx="12" class="box"/>
  <text x="490" y="447" text-anchor="middle" class="h">Homogenisieren</text>
  <text x="387" y="478" class="t">gleichmaessige Zusammensetzung und Textur</text>
  <text x="387" y="504" class="small">Qualitaet wird an Stabilitaet gemessen</text>
</svg>
