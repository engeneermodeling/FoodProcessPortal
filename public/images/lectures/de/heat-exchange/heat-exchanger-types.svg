<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Haupttypen von Waermeuebertragern fuer Lebensmittelprozesse</title>
  <desc id="desc">Vergleich von Platten-, Rohr-, Kratzwaermeuebertrager und Mantelapparat.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.metal{fill:#e2e8f0;stroke:#475569;stroke-width:2}.hot{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#hot)}.cold{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#cold)}.scraper{stroke:#7c3aed;stroke-width:5;fill:none}.h{fill:#0f172a;font:700 22px Arial}.t{fill:#334155;font:15px Arial}
    </style>
    <marker id="hot" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="cold" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="980" height="560" rx="18"/>
  <g transform="translate(55 55)">
    <rect class="card" width="400" height="200" rx="14"/>
    <text x="200" y="36" text-anchor="middle" class="h">Plattenapparat</text>
    <g transform="translate(105 65)">
      <rect class="metal" x="0" y="0" width="18" height="95"/><rect class="metal" x="34" y="0" width="18" height="95"/><rect class="metal" x="68" y="0" width="18" height="95"/><rect class="metal" x="102" y="0" width="18" height="95"/><rect class="metal" x="136" y="0" width="18" height="95"/>
      <path class="hot" d="M-50 25 H180"/><path class="cold" d="M180 70 H-50"/>
    </g>
    <text x="200" y="176" text-anchor="middle" class="t">Milch, klare Saefte, Bier, Regeneration</text>
  </g>
  <g transform="translate(525 55)">
    <rect class="card" width="400" height="200" rx="14"/>
    <text x="200" y="36" text-anchor="middle" class="h">Rohrapparat</text>
    <g transform="translate(75 75)">
      <rect class="metal" x="0" y="0" width="250" height="70" rx="35"/>
      <path class="hot" d="M15 20 C70 0 120 40 175 20 C205 10 225 15 240 20"/>
      <path class="cold" d="M240 52 C185 72 130 32 80 52 C45 65 25 58 15 52"/>
    </g>
    <text x="200" y="176" text-anchor="middle" class="t">Pueree, Saefte mit Fruchtfleisch, partikelhaltige Produkte</text>
  </g>
  <g transform="translate(55 305)">
    <rect class="card" width="400" height="200" rx="14"/>
    <text x="200" y="36" text-anchor="middle" class="h">Kratzwaermeuebertrager</text>
    <g transform="translate(115 70)">
      <rect class="metal" x="0" y="0" width="170" height="95" rx="47"/>
      <line class="scraper" x1="85" y1="12" x2="85" y2="83"/>
      <line class="scraper" x1="45" y1="47" x2="125" y2="47"/>
      <path class="hot" d="M-60 47 H20"/>
      <path class="cold" d="M150 47 H230"/>
    </g>
    <text x="200" y="176" text-anchor="middle" class="t">Konfitueren, Cremes, Pasten, anbrennende Produkte</text>
  </g>
  <g transform="translate(525 305)">
    <rect class="card" width="400" height="200" rx="14"/>
    <text x="200" y="36" text-anchor="middle" class="h">Mantelapparat</text>
    <g transform="translate(130 62)">
      <path class="metal" d="M0 0 H140 V88 Q70 130 0 88 Z"/>
      <path class="hot" d="M-75 100 C-25 100 -15 86 0 78"/>
      <path class="cold" d="M140 22 C170 5 200 0 235 0"/>
    </g>
    <text x="200" y="176" text-anchor="middle" class="t">Chargen, Sirupe, Fuellungen, Kochkessel</text>
  </g>
</svg>
