<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Transport options for bulk food materials</title>
  <desc id="desc">Map of mechanical and pneumatic conveying: belt, screw, bucket elevator, dilute and dense phase.</desc>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Choose the conveyor by material, not by habit</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="150" fill="#bfdbfe" font-size="18" font-weight="700">Belt</text>
    <text x="76" y="178" fill="#f8fafc" font-size="15">gentle, open or closed</text>
    <text x="76" y="200" fill="#94a3b8" font-size="14">grain, vegetables, packaged products</text>

    <rect x="335" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="150" fill="#fed7aa" font-size="18" font-weight="700">Screw</text>
    <text x="359" y="178" fill="#f8fafc" font-size="15">compact, dosing</text>
    <text x="359" y="200" fill="#94a3b8" font-size="14">flour, groats, wet masses</text>

    <rect x="618" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="150" fill="#bbf7d0" font-size="18" font-weight="700">Bucket elevator</text>
    <text x="642" y="178" fill="#f8fafc" font-size="15">vertical lifting</text>
    <text x="642" y="200" fill="#94a3b8" font-size="14">grain, seeds, pellets</text>

    <rect x="52" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="284" fill="#bae6fd" font-size="18" font-weight="700">Pneumatic: dilute phase</text>
    <text x="76" y="312" fill="#f8fafc" font-size="15">particles fly in the flow</text>
    <text x="76" y="334" fill="#94a3b8" font-size="14">simple, but more wear</text>

    <rect x="335" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="284" fill="#ddd6fe" font-size="18" font-weight="700">Pneumatic: dense phase</text>
    <text x="359" y="312" fill="#f8fafc" font-size="15">slower and gentler</text>
    <text x="359" y="334" fill="#94a3b8" font-size="14">fragile pellets, agglomerates</text>

    <rect x="618" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="284" fill="#fecaca" font-size="18" font-weight="700">Vibratory</text>
    <text x="642" y="312" fill="#f8fafc" font-size="15">short distance, dosing</text>
    <text x="642" y="334" fill="#94a3b8" font-size="14">fragile or sticky fractions</text>
  </g>
</svg>
