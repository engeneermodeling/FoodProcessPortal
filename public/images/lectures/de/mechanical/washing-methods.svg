<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Food raw material washing methods</title>
  <desc id="desc">Comparison of drum, flotation, brush and shower washing for different raw materials.</desc>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Washing method depends on raw material shape and strength</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="152" fill="#bfdbfe" font-size="18" font-weight="700">Drum washing</text>
    <text x="76" y="180" fill="#f8fafc" font-size="15">friction + rotation</text>
    <text x="76" y="202" fill="#94a3b8" font-size="14">potatoes, root crops</text>
    <rect x="335" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="152" fill="#bae6fd" font-size="18" font-weight="700">Flotation</text>
    <text x="359" y="180" fill="#f8fafc" font-size="15">water + density difference</text>
    <text x="359" y="202" fill="#94a3b8" font-size="14">leaves, stones, light impurities</text>
    <rect x="618" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="152" fill="#bbf7d0" font-size="18" font-weight="700">Brush</text>
    <text x="642" y="180" fill="#f8fafc" font-size="15">mechanical soil removal</text>
    <text x="642" y="202" fill="#94a3b8" font-size="14">vegetables, firm fruits</text>
    <rect x="52" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="288" fill="#fed7aa" font-size="18" font-weight="700">Shower</text>
    <text x="76" y="316" fill="#f8fafc" font-size="15">water jets</text>
    <text x="76" y="338" fill="#94a3b8" font-size="14">delicate raw material</text>
    <rect x="335" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="288" fill="#fecaca" font-size="18" font-weight="700">Air cleaning</text>
    <text x="359" y="316" fill="#f8fafc" font-size="15">aspiration, dust, husk</text>
    <text x="359" y="338" fill="#94a3b8" font-size="14">grain, seeds, spices</text>
    <rect x="618" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="288" fill="#ddd6fe" font-size="18" font-weight="700">Combined</text>
    <text x="642" y="316" fill="#f8fafc" font-size="15">dry + wet + inspection</text>
    <text x="642" y="338" fill="#94a3b8" font-size="14">postharvest lines</text>
  </g>
</svg>
