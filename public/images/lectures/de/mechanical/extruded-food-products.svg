<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Examples of extruded food products</title>
  <desc id="desc">Product map: pasta, snacks, flakes, breakfast cereals, breadcrumbs, textured plant products.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Extrusion sets shape, porosity and texture</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="150" fill="#fde68a" font-size="18" font-weight="700">Pasta</text>
    <text x="76" y="178" fill="#f8fafc" font-size="15">shape through die</text>
    <text x="76" y="200" fill="#94a3b8" font-size="14">drying determines strength</text>
    <rect x="335" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="150" fill="#bbf7d0" font-size="18" font-weight="700">Snacks</text>
    <text x="359" y="178" fill="#f8fafc" font-size="15">expansion after die</text>
    <text x="359" y="200" fill="#94a3b8" font-size="14">crispness, porosity</text>
    <rect x="618" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="150" fill="#bae6fd" font-size="18" font-weight="700">Breakfast cereals</text>
    <text x="642" y="178" fill="#f8fafc" font-size="15">flakes, balls, pillows</text>
    <text x="642" y="200" fill="#94a3b8" font-size="14">texture after drying</text>
    <rect x="52" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="284" fill="#fecaca" font-size="18" font-weight="700">Breading</text>
    <text x="76" y="312" fill="#f8fafc" font-size="15">crumb structure</text>
    <text x="76" y="334" fill="#94a3b8" font-size="14">size, colour, oil absorption</text>
    <rect x="335" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="284" fill="#ddd6fe" font-size="18" font-weight="700">Plant proteins</text>
    <text x="359" y="312" fill="#f8fafc" font-size="15">fibrous structure</text>
    <text x="359" y="334" fill="#94a3b8" font-size="14">texture and moisture</text>
    <rect x="618" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="284" fill="#fed7aa" font-size="18" font-weight="700">Semi-finished products</text>
    <text x="642" y="312" fill="#f8fafc" font-size="15">pellets, blanks</text>
    <text x="642" y="334" fill="#94a3b8" font-size="14">then drying or frying</text>
  </g>
</svg>
