<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Stoffbilanz eines Verdampfers</title>
  <desc id="desc">Das Schema zeigt: Saft tritt ein, Konzentrat und verdampftes Wasser treten aus; Trockensubstanz bleibt erhalten.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#174ea6"/></marker>
    <style>
      .bg{fill:#f8fbff}.unit{fill:#fff;stroke:#8da4c4;stroke-width:4;rx:20}.liq{fill:#fff7e6;stroke:#e6b450;stroke-width:3}.steam{fill:#eef2ff;stroke:#7aa2df;stroke-width:3}.flow{stroke:#174ea6;stroke-width:6;fill:none;marker-end:url(#arrow)}.vap{stroke:#e07a1f;stroke-width:6;fill:none;marker-end:url(#arrow)}.txt{font-family:Arial,"Helvetica Neue",sans-serif;fill:#102033;font-size:23px}.head{font-size:31px;font-weight:700;fill:#0f2a4f}.label{font-size:25px;font-weight:700}.small{font-size:19px;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1080" height="560"/>
  <text class="txt head" x="540" y="50" text-anchor="middle">Stoffbilanz: nichts verschwindet</text>
  <rect class="unit" x="415" y="135" width="250" height="260"/>
  <ellipse class="liq" cx="540" cy="395" rx="125" ry="35"/>
  <path class="liq" d="M415 190 C455 165 625 165 665 190 L665 395 C625 430 455 430 415 395 Z"/>
  <path class="vap" d="M540 130 C540 82 590 92 590 58"/>
  <path class="vap" d="M500 130 C495 90 455 100 455 62"/>
  <path class="flow" d="M90 265 H390"/>
  <path class="flow" d="M690 265 H985"/>
  <text class="txt label" x="110" y="226">Eintritt</text>
  <text class="txt small" x="110" y="255">Saft 10 000 kg/h</text>
  <text class="txt small" x="110" y="285">10% Trockensubstanz</text>
  <text class="txt label" x="740" y="226">Austritt</text>
  <text class="txt small" x="740" y="255">Konzentrat 1538 kg/h</text>
  <text class="txt small" x="740" y="285">65% Trockensubstanz</text>
  <text class="txt small" x="710" y="82">verdampftes Wasser</text>
  <text class="txt small" x="710" y="110">8462 kg/h</text>
  <rect class="steam" x="300" y="435" width="480" height="70" rx="16"/>
  <text class="txt label" x="540" y="465" text-anchor="middle">Trockensubstanz: 10 000 · 0,10 = 1538 · 0,65</text>
  <text class="txt small" x="540" y="493" text-anchor="middle">Bilanz nach Gesamtmasse oder nach Schluesselkomponente</text>
</svg>
