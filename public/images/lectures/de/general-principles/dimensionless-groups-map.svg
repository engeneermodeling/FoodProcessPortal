<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Karte der Aehnlichkeitskriterien</title>
  <desc id="desc">Das Schema gruppiert dimensionslose Kriterien nach physikalischer Bedeutung: Stroemung, Waermeuebergang, Stoffuebergang, Gravitation und Druckverlust.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#174ea6"/></marker>
    <style>
      .bg{fill:#f8fbff}.center{fill:#fff;stroke:#174ea6;stroke-width:4}.box{fill:#fff;stroke:#8da4c4;stroke-width:3;rx:18}.heat{fill:#fff7e6;stroke:#e6b450;stroke-width:3}.mass{fill:#ecfdf5;stroke:#2f9e67;stroke-width:3}.hydro{fill:#eef6ff;stroke:#5b8fd8;stroke-width:3}.grav{fill:#f3f0ff;stroke:#8b5cf6;stroke-width:3}.line{stroke:#174ea6;stroke-width:4;fill:none;marker-end:url(#arrow)}.txt{font-family:Arial,"Helvetica Neue",sans-serif;fill:#102033;font-size:22px}.head{font-size:31px;font-weight:700;fill:#0f2a4f}.label{font-size:25px;font-weight:700}.small{font-size:18px;fill:#334155}.formula{font-size:24px;font-weight:700;fill:#0f2a4f}
    </style>
  </defs>
  <rect class="bg" width="1080" height="560"/>
  <text class="txt head" x="540" y="48" text-anchor="middle">Aehnlichkeitskriterien liest man als Verhaeltnisse physikalischer Effekte</text>
  <circle class="center" cx="540" cy="275" r="95"/>
  <text class="txt label" x="540" y="250" text-anchor="middle">Prozess</text>
  <text class="txt small" x="540" y="280" text-anchor="middle">in Rohr, Ruehrer,</text>
  <text class="txt small" x="540" y="305" text-anchor="middle">Waermeuebertrager</text>

  <rect class="box hydro" x="70" y="105" width="280" height="120"/>
  <text class="txt label" x="210" y="140" text-anchor="middle">Re</text>
  <text class="txt formula" x="210" y="172" text-anchor="middle">Traegheit / Viskositaet</text>
  <text class="txt small" x="210" y="202" text-anchor="middle">Stroemungsregime des Produkts</text>

  <rect class="box heat" x="730" y="105" width="280" height="120"/>
  <text class="txt label" x="870" y="140" text-anchor="middle">Nu, Pr, Pe</text>
  <text class="txt formula" x="870" y="172" text-anchor="middle">Konvektion / Leitung</text>
  <text class="txt small" x="870" y="202" text-anchor="middle">Pasteurisation, Kuehlung</text>

  <rect class="box grav" x="70" y="340" width="280" height="120"/>
  <text class="txt label" x="210" y="375" text-anchor="middle">Fr, Ar</text>
  <text class="txt formula" x="210" y="407" text-anchor="middle">Traegheit / Gravitation</text>
  <text class="txt small" x="210" y="437" text-anchor="middle">Sedimentation, Schaum, Tropfen</text>

  <rect class="box mass" x="730" y="340" width="280" height="120"/>
  <text class="txt label" x="870" y="375" text-anchor="middle">Sh, Sc</text>
  <text class="txt formula" x="870" y="407" text-anchor="middle">Stoffuebergang / Diffusion</text>
  <text class="txt small" x="870" y="437" text-anchor="middle">Extraktion, Trocknung, Membranen</text>

  <path class="line" d="M455 230 C385 175 360 165 350 165"/>
  <path class="line" d="M625 230 C695 175 720 165 730 165"/>
  <path class="line" d="M455 320 C385 375 360 400 350 400"/>
  <path class="line" d="M625 320 C695 375 720 400 730 400"/>
</svg>
