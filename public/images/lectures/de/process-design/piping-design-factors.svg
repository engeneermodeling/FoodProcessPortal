<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Piping design factors</title>
  <desc id="desc">Skhema osnovnykh faktoriv vyboru truboprovodu kharchovoi line: vytrata, shvydkist, vtraty tysku, hihiienichnist, CIP, drain.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Pipe diameter is not selected by flow rate alone</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <circle cx="460" cy="218" r="78" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
    <text x="414" y="211" fill="#dbeafe">Pipeline</text>
    <text x="426" y="236" fill="#dbeafe">line</text>
    <g fill="#1e293b" stroke="#38bdf8" stroke-width="2">
      <rect x="74" y="104" width="190" height="58" rx="12"/>
      <rect x="365" y="78" width="190" height="58" rx="12"/>
      <rect x="656" y="104" width="190" height="58" rx="12"/>
      <rect x="656" y="274" width="190" height="58" rx="12"/>
      <rect x="365" y="300" width="190" height="58" rx="12"/>
      <rect x="74" y="274" width="190" height="58" rx="12"/>
    </g>
    <text x="133" y="139" fill="#e0f2fe">Flow rate</text>
    <text x="416" y="113" fill="#e0f2fe">Velocity</text>
    <text x="696" y="139" fill="#e0f2fe">Pressure loss</text>
    <text x="710" y="309" fill="#e0f2fe">Drainage</text>
