<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Схемы экстрагирования: однократная, многократная и противоточная</title>
  <desc id="desc">Сравнение трех схем контакта сырья и растворителя для экстрагирования.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.stage{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.arrowS{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#s)}.arrowL{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#l)}.h{fill:#0f172a;font:700 22px Arial}.t{fill:#334155;font:15px Arial}.small{fill:#475569;font:14px Arial}
    </style>
    <marker id="s" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#0f766e"/></marker>
    <marker id="l" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="980" height="540" rx="18"/>
  <text x="490" y="45" text-anchor="middle" class="h">Чем лучше организован контакт, тем меньше растворителя нужно для той же полноты извлечения</text>
  <g transform="translate(55 105)">
    <rect class="box" width="270" height="330" rx="14"/>
    <text x="135" y="40" text-anchor="middle" class="h">Одноступенчатая</text>
    <rect class="stage" x="75" y="130" width="120" height="75" rx="12"/>
    <text x="135" y="176" text-anchor="middle" class="t">контакт</text>
    <path class="arrowS" d="M15 145 H75"/>
    <path class="arrowL" d="M15 190 H75"/>
    <path class="arrowS" d="M195 145 H255"/>
    <path class="arrowL" d="M195 190 H255"/>
    <text x="135" y="280" text-anchor="middle" class="small">простая, но экстракт слабее</text>
  </g>
  <g transform="translate(355 105)">
    <rect class="box" width="270" height="330" rx="14"/>
    <text x="135" y="40" text-anchor="middle" class="h">Многоступенчатая</text>
    <rect class="stage" x="30" y="135" width="62" height="62" rx="10"/>
    <rect class="stage" x="104" y="135" width="62" height="62" rx="10"/>
    <rect class="stage" x="178" y="135" width="62" height="62" rx="10"/>
    <path class="arrowS" d="M0 166 H30"/>
    <path class="arrowS" d="M92 166 H104"/>
    <path class="arrowS" d="M166 166 H178"/>
    <path class="arrowS" d="M240 166 H270"/>
    <path class="arrowL" d="M30 220 H240"/>
    <text x="135" y="280" text-anchor="middle" class="small">лучшее извлечение, больше аппаратов</text>
  </g>
  <g transform="translate(655 105)">
    <rect class="box" width="270" height="330" rx="14"/>
    <text x="135" y="40" text-anchor="middle" class="h">Противоточная</text>
    <rect class="stage" x="30" y="135" width="62" height="62" rx="10"/>
    <rect class="stage" x="104" y="135" width="62" height="62" rx="10"/>
    <rect class="stage" x="178" y="135" width="62" height="62" rx="10"/>
    <path class="arrowS" d="M0 150 H270"/>
    <path class="arrowL" d="M270 190 H0"/>
    <text x="135" y="280" text-anchor="middle" class="small">самая эффективная для непрерывных процессов</text>
  </g>
  <text x="130" y="478" class="t" fill="#0f766e">зеленый поток - твердая фаза</text>
  <text x="610" y="478" class="t" fill="#2563eb">синий поток - растворитель / экстракт</text>
</svg>
