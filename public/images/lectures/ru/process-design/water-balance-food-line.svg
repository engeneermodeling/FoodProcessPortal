<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Водний баланс харчовои линии</title>
  <desc id="desc">Схема входив и виходив води для харчовои линии: продукт, CIP, охолодження, пара, стоки.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Водний баланс показуе, де линия споживае и втрачае ресурс</text>
  <rect x="342" y="152" width="236" height="110" rx="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
  <text x="390" y="197" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="700">Харчова</text>
  <text x="402" y="226" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="700">линия</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e0f2fe">
    <rect x="62" y="104" width="170" height="54" rx="12" fill="#164e63" stroke="#06b6d4"/>
    <text x="92" y="137">Вода продукту</text>
    <rect x="62" y="188" width="170" height="54" rx="12" fill="#164e63" stroke="#06b6d4"/>
    <text x="102" y="221">CIP / миття</text>
    <rect x="62" y="272" width="170" height="54" rx="12" fill="#164e63" stroke="#06b6d4"/>
    <text x="103" y="305">Охолодження</text>
    <rect x="688" y="104" width="170" height="54" rx="12" fill="#854d0e" stroke="#f59e0b"/>
    <text x="719" y="137">Готовий продукт</text>
    <rect x="688" y="188" width="170" height="54" rx="12" fill="#7f1d1d" stroke="#ef4444"/>
    <text x="749" y="221">Стоки</text>
    <rect x="688" y="272" width="170" height="54" rx="12" fill="#14532d" stroke="#22c55e"/>
    <text x="730" y="305">Повернення</text>
  </g>
  <g stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)">
    <path d="M232 131h102"/>
    <path d="M232 215h102"/>
    <path d="M232 299h102"/>
    <path d="M580 180h100"/>
    <path d="M580 216h100"/>
    <path d="M580 252h100"/>
  </g>
</svg>
