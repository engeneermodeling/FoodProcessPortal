<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Петля контролю якости</title>
  <desc id="desc">Схема циклу контролю якости харчового процесу: спецификация, вимирювання, ришення, коригування, запис.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Контрол якости працюе як замкнена петля</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <circle cx="460" cy="218" r="74" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
    <text x="417" y="213" fill="#dbeafe" font-size="19">Продукт</text>
    <text x="418" y="238" fill="#dbeafe" font-size="19">и процес</text>
    <g fill="#1e293b" stroke="#38bdf8" stroke-width="2">
      <rect x="88" y="104" width="170" height="58" rx="12"/>
      <rect x="374" y="82" width="172" height="58" rx="12"/>
      <rect x="662" y="104" width="170" height="58" rx="12"/>
      <rect x="662" y="274" width="170" height="58" rx="12"/>
      <rect x="374" y="296" width="172" height="58" rx="12"/>
      <rect x="88" y="274" width="170" height="58" rx="12"/>
    </g>
    <text x="120" y="139" fill="#e0f2fe">Спецификация</text>
    <text x="405" y="117" fill="#e0f2fe">Вимирювання</text>
    <text x="704" y="139" fill="#e0f2fe">Ришення</text>
    <text x="690" y="309" fill="#e0f2fe">Коригування</text>
    <text x="431" y="331" fill="#e0f2fe">Запис</text>
    <text x="127" y="309" fill="#e0f2fe">Перевирка</text>
    <path d="M258 133 L374 111" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M546 111 L662 133" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M747 162v104" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M662 303 L546 325" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M374 325 L258 303" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M173 274V170" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
