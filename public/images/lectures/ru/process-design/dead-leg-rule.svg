<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Мертви зони у трубопроводи</title>
  <desc id="desc">Схема короткого и довгого видгалуження в трубопроводи, що илюструе ризик застою продукту в dead leg.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Довге глухе видгалуження стае мертвою зоною</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="122" y="116" fill="#dcfce7">Менший ризик</text>
    <line x1="104" y1="204" x2="386" y2="204" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <line x1="245" y1="204" x2="245" y2="156" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <circle cx="245" cy="156" r="18" fill="#0f172a" stroke="#22c55e" stroke-width="4"/>
    <text x="216" y="268" fill="#cbd5e1">короткий патрубок</text>
    <text x="568" y="116" fill="#fecaca">Вищий ризик</text>
    <line x1="536" y1="204" x2="818" y2="204" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <line x1="677" y1="204" x2="677" y2="104" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <circle cx="677" cy="104" r="18" fill="#0f172a" stroke="#ef4444" stroke-width="4"/>
    <ellipse cx="677" cy="154" rx="18" ry="30" fill="#f97316" opacity="0.8"/>
    <text x="604" y="268" fill="#cbd5e1">застий и слабке промивання</text>
  </g>
  <rect x="116" y="330" width="688" height="50" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="146" y="361" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Dead leg оцинюют не тилки за геометриею, а й за промиванням, температурою, продуктом и режимом CIP.</text>
</svg>
