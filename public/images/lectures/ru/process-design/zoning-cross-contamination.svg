<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
  <title id="title">Зонування и перехресне забруднення</title>
  <desc id="desc">Схема роздилення сирои и готовои зон та потокив персоналу, продукту и видходив.</desc>
  <rect width="920" height="450" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Зонування зменшуе ризик перехресного забруднення</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="74" y="120" width="340" height="230" rx="18" fill="#7f1d1d" opacity=".75" stroke="#ef4444"/>
    <text x="178" y="166" fill="#fee2e2" font-size="24">сира зона</text>
    <text x="126" y="210" fill="#fecaca" font-size="15">сировина, тара, земля, микрофлора</text>
    <rect x="506" y="120" width="340" height="230" rx="18" fill="#14532d" opacity=".78" stroke="#22c55e"/>
    <text x="600" y="166" fill="#dcfce7" font-size="24">готова зона</text>
    <text x="560" y="210" fill="#bbf7d0" font-size="15">охолоджений продукт, пакування</text>
    <rect x="430" y="102" width="58" height="266" rx="12" fill="#1f2937" stroke="#475569"/>
    <text x="444" y="216" fill="#f8fafc" font-size="14" transform="rotate(-90 444 216)">санитарний бар'ер</text>
    <path d="M278 278h330" stroke="#38bdf8" stroke-width="7"/>
    <path d="M592 260l28 18-28 18" fill="none" stroke="#38bdf8" stroke-width="7"/>
    <path d="M610 324H282" stroke="#f59e0b" stroke-width="6" stroke-dasharray="12 10"/>
    <text x="320" y="308" fill="#dbeafe" font-size="15">контролований потик продукту</text>
    <text x="312" y="366" fill="#fde68a" font-size="15">персонал и видходи не мают рухатис назад</text>
  </g>
</svg>
