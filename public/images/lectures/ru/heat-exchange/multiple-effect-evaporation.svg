<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Многокорпусная выпарная установка</title>
  <desc id="desc">Схема трех корпусов, где вторичный пар предыдущего корпуса нагревает следующий корпус при более низком давлении.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.effect{fill:#fff;stroke:#1e293b;stroke-width:3}.liq{fill:#dbeafe}.steam{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#h)}.vap{stroke:#7c3aed;stroke-width:5;fill:none;marker-end:url(#v)}.prod{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#p)}.h{fill:#0f172a;font:700 22px Arial}.t{fill:#334155;font:16px Arial}.small{fill:#475569;font:14px Arial}
    </style>
    <marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="v" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="980" height="500" rx="18"/>
  <text x="490" y="45" text-anchor="middle" class="h">Каждый следующий корпус кипит при более низком давлении и температуре</text>
  <g transform="translate(95 110)">
    <rect class="effect" width="190" height="230" rx="16"/>
    <path class="liq" d="M18 145 H172 V205 Q95 238 18 205 Z"/>
    <text x="95" y="50" text-anchor="middle" class="h">I корпус</text>
    <text x="95" y="80" text-anchor="middle" class="small">наивысшая T</text>
  </g>
  <g transform="translate(395 110)">
    <rect class="effect" width="190" height="230" rx="16"/>
    <path class="liq" d="M18 145 H172 V205 Q95 238 18 205 Z"/>
    <text x="95" y="50" text-anchor="middle" class="h">II корпус</text>
    <text x="95" y="80" text-anchor="middle" class="small">ниже давление</text>
  </g>
  <g transform="translate(695 110)">
    <rect class="effect" width="190" height="230" rx="16"/>
    <path class="liq" d="M18 145 H172 V205 Q95 238 18 205 Z"/>
    <text x="95" y="50" text-anchor="middle" class="h">III корпус</text>
    <text x="95" y="80" text-anchor="middle" class="small">самая низкая T</text>
  </g>
  <path class="steam" d="M35 175 H95"/>
  <text x="28" y="160" class="t">свежий пар</text>
  <path class="vap" d="M285 155 C330 115 350 115 395 155"/>
  <text x="307" y="104" class="small">вторичный пар</text>
  <path class="vap" d="M585 155 C630 115 650 115 695 155"/>
  <text x="607" y="104" class="small">вторичный пар</text>
  <path class="prod" d="M50 285 H95"/>
  <path class="prod" d="M285 285 H395"/>
  <path class="prod" d="M585 285 H695"/>
  <path class="prod" d="M885 285 H945"/>
  <text x="35" y="310" class="t">питание</text>
  <text x="825" y="310" class="t">концентрат</text>
  <text x="490" y="440" text-anchor="middle" class="h">меньше расход свежего пара, но больше площадь и сложнее режим</text>
</svg>
