<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Парокомпрессионный холодильный цикл</title>
  <desc id="desc">Схема показывает испаритель, компрессор, конденсатор и дроссельный вентиль с направлением движения хладагента.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.unit{fill:#fff;stroke:#cbd5e1;stroke-width:3}.evap{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.cond{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.comp{fill:#fef3c7;stroke:#ca8a04;stroke-width:3}.valve{fill:#ede9fe;stroke:#7c3aed;stroke-width:3}.pipe{stroke:#334155;stroke-width:5;fill:none;marker-end:url(#a)}.cold{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#c)}.hot{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#h)}.h{fill:#0f172a;font:700 22px Arial}.t{fill:#334155;font:16px Arial}.small{fill:#475569;font:14px Arial}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="c" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>
  <rect class="bg" width="980" height="540" rx="18"/>
  <text x="490" y="45" text-anchor="middle" class="h">Холодильная машина переносит теплоту от продукта к окружающей среде</text>
  <rect x="90" y="180" width="230" height="135" rx="16" class="evap"/>
  <rect x="380" y="80" width="220" height="115" rx="16" class="comp"/>
  <rect x="660" y="180" width="230" height="135" rx="16" class="cond"/>
  <rect x="380" y="365" width="220" height="95" rx="16" class="valve"/>
  <text x="205" y="235" text-anchor="middle" class="h">Испаритель</text>
  <text x="205" y="264" text-anchor="middle" class="small">отбирает тепло от продукта</text>
  <text x="490" y="126" text-anchor="middle" class="h">Компрессор</text>
  <text x="490" y="154" text-anchor="middle" class="small">повышает давление и температуру</text>
  <text x="775" y="235" text-anchor="middle" class="h">Конденсатор</text>
  <text x="775" y="264" text-anchor="middle" class="small">отдает тепло воде или воздуху</text>
  <text x="490" y="411" text-anchor="middle" class="h">Дроссель</text>
  <text x="490" y="438" text-anchor="middle" class="small">снижает давление</text>
  <path class="pipe" d="M320 210 C360 135 370 135 380 135"/>
  <path class="pipe" d="M600 135 C640 135 640 210 660 210"/>
  <path class="pipe" d="M775 315 C775 420 630 412 600 412"/>
  <path class="pipe" d="M380 412 C290 412 205 365 205 315"/>
  <path class="cold" d="M35 250 H90"/>
  <text x="45" y="226" class="t">тепло от продукта</text>
  <path class="hot" d="M890 250 H945"/>
  <text x="806" y="350" class="t">тепло в среду или утилизацию</text>
</svg>
