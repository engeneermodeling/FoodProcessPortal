<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Силы, действующие на частицу при отстаивании</title>
  <desc id="desc">Схема шарообразной частицы в жидкости: сила тяжести вниз, сила Архимеда вверх, сила сопротивления против движения, скорость осаждения w ноль.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#174ea6"/>
    </marker>
    <style>
      .bg { fill: #f8fbff; }
      .tank { fill: #eaf6ff; stroke: #9fc4e6; stroke-width: 3; }
      .particle { fill: #ffd166; stroke: #a36b00; stroke-width: 4; }
      .line { stroke: #174ea6; stroke-width: 5; marker-end: url(#arrow); }
      .drag { stroke: #c2410c; stroke-width: 5; marker-end: url(#arrow); }
      .txt { font-family: Arial, "Helvetica Neue", sans-serif; fill: #102033; font-size: 26px; }
      .label { font-size: 30px; font-weight: 700; }
      .small { font-size: 21px; fill: #334155; }
      .bubble { fill: #ffffff; stroke: #c7d7ea; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect class="bg" width="980" height="560"/>
  <text class="txt label" x="490" y="46" text-anchor="middle">Отстаивание: баланс сил на частице</text>
  <rect class="tank" x="260" y="86" width="460" height="390" rx="22"/>
  <path d="M275 145 C355 115 430 180 512 145 C592 112 650 170 705 140" fill="none" stroke="#b5d7ef" stroke-width="5"/>
  <circle class="particle" cx="490" cy="280" r="68"/>
  <text class="txt label" x="490" y="290" text-anchor="middle">d</text>

  <line class="line" x1="490" y1="215" x2="490" y2="118"/>
  <text class="txt label" x="520" y="145">A</text>
  <text class="txt small" x="550" y="145">выталкивание</text>

  <line class="line" x1="490" y1="345" x2="490" y2="445"/>
  <text class="txt label" x="520" y="425">G</text>
  <text class="txt small" x="550" y="425">сила тяжести</text>

  <line class="drag" x1="610" y1="280" x2="705" y2="280"/>
  <text class="txt label" x="728" y="289">R</text>
  <text class="txt small" x="728" y="320">сопротивление среды</text>

  <line class="line" x1="370" y1="280" x2="300" y2="280"/>
  <text class="txt label" x="275" y="289">w₀</text>
  <text class="txt small" x="42" y="508">В установившемся режиме ускорение исчезает: разность G - A уравновешивается сопротивлением R.</text>
  <rect class="bubble" x="42" y="92" width="188" height="128"/>
  <text class="txt small" x="136" y="132" text-anchor="middle">Частица тяжелее</text>
  <text class="txt small" x="136" y="160" text-anchor="middle">жидкости:</text>
  <text class="txt label" x="136" y="198" text-anchor="middle">оседает</text>
  <rect class="bubble" x="750" y="92" width="188" height="128"/>
  <text class="txt small" x="844" y="132" text-anchor="middle">Жировая капля</text>
  <text class="txt small" x="844" y="160" text-anchor="middle">в молоке:</text>
  <text class="txt label" x="844" y="198" text-anchor="middle">всплывает</text>
</svg>
