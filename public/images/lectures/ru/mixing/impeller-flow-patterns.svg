<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">Типовые потоки в аппарате с мешалкой</title>
  <desc id="desc">Три схемы показывают осевой, радиальный и тангенциальный поток в резервуаре.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.tank{fill:#fff;stroke:#94a3b8;stroke-width:3}.shaft{stroke:#334155;stroke-width:8;stroke-linecap:round}.imp{fill:#2563eb}.arrow{stroke:#0f766e;stroke-width:5;fill:none;stroke-linecap:round}.title{fill:#0f172a;font:700 24px Arial}.label{fill:#334155;font:16px Arial}.note{fill:#475569;font:14px Arial}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="980" height="460" rx="18"/>
  <g transform="translate(55 54)">
    <text x="130" y="0" text-anchor="middle" class="title">Осевой поток</text>
    <path class="tank" d="M35 35 H225 V280 Q130 335 35 280 Z"/>
    <line class="shaft" x1="130" y1="35" x2="130" y2="230"/>
    <path class="imp" d="M85 224 L130 202 L175 224 L130 246 Z"/>
    <path class="arrow" marker-end="url(#a)" d="M130 92 C130 130 130 165 130 198"/>
    <path class="arrow" marker-end="url(#a)" d="M92 250 C60 230 58 120 98 85"/>
    <path class="arrow" marker-end="url(#a)" d="M168 250 C205 225 202 118 160 82"/>
    <text x="130" y="365" text-anchor="middle" class="label">пропеллерная, лопастная</text>
    <text x="130" y="389" text-anchor="middle" class="note">суспензии, теплообмен</text>
  </g>
  <g transform="translate(360 54)">
    <text x="130" y="0" text-anchor="middle" class="title">Радиальный поток</text>
    <path class="tank" d="M35 35 H225 V280 Q130 335 35 280 Z"/>
    <line class="shaft" x1="130" y1="35" x2="130" y2="230"/>
    <rect class="imp" x="82" y="205" width="96" height="28" rx="6"/>
    <path class="arrow" marker-end="url(#a)" d="M130 218 C92 218 70 218 48 218"/>
    <path class="arrow" marker-end="url(#a)" d="M130 218 C168 218 190 218 212 218"/>
    <path class="arrow" marker-end="url(#a)" d="M70 222 C58 170 74 105 116 82"/>
    <path class="arrow" marker-end="url(#a)" d="M190 222 C204 168 188 105 146 82"/>
    <text x="130" y="365" text-anchor="middle" class="label">турбинная</text>
    <text x="130" y="389" text-anchor="middle" class="note">эмульсии, диспергирование</text>
  </g>
  <g transform="translate(665 54)">
    <text x="130" y="0" text-anchor="middle" class="title">Тангенциальный поток</text>
    <path class="tank" d="M35 35 H225 V280 Q130 335 35 280 Z"/>
    <line class="shaft" x1="130" y1="35" x2="130" y2="230"/>
    <path class="imp" d="M80 218 H180 V240 H80 Z"/>
    <path class="arrow" marker-end="url(#a)" d="M72 145 C88 95 172 95 188 145"/>
    <path class="arrow" marker-end="url(#a)" d="M188 145 C204 198 162 260 100 246"/>
    <path class="arrow" marker-end="url(#a)" d="M100 246 C48 225 40 170 72 145"/>
    <text x="130" y="365" text-anchor="middle" class="label">якорная, рамная</text>
    <text x="130" y="389" text-anchor="middle" class="note">вязкие продукты</text>
  </g>
</svg>
