<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Состояния суспендирования твердых частиц</title>
  <desc id="desc">Сравнение осадка на дне, частичного суспендирования и полного отрыва частиц от дна.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.tank{fill:#fff;stroke:#334155;stroke-width:3}.liq{fill:#dbeafe}.p{fill:#a16207}.shaft{stroke:#111827;stroke-width:6}.imp{fill:#7c3aed}.h{fill:#0f172a;font:700 22px Arial}.t{fill:#334155;font:15px Arial}
    </style>
  </defs>
  <rect class="bg" width="980" height="430" rx="18"/>
  <g transform="translate(75 55)">
    <text x="120" y="0" text-anchor="middle" class="h">Осадок</text>
    <path class="tank" d="M30 35 H210 V250 Q120 300 30 250 Z"/>
    <path class="liq" d="M34 95 H206 V245 Q120 288 34 245 Z"/>
    <line class="shaft" x1="120" y1="35" x2="120" y2="205"/>
    <path class="imp" d="M78 205 H162 L120 228 Z"/>
    <circle class="p" cx="70" cy="245" r="9"/><circle class="p" cx="95" cy="253" r="8"/><circle class="p" cx="130" cy="250" r="10"/><circle class="p" cx="165" cy="244" r="9"/>
    <text x="120" y="337" text-anchor="middle" class="t">малая скорость или неудачный поток</text>
  </g>
  <g transform="translate(370 55)">
    <text x="120" y="0" text-anchor="middle" class="h">Частичное суспендирование</text>
    <path class="tank" d="M30 35 H210 V250 Q120 300 30 250 Z"/>
    <path class="liq" d="M34 95 H206 V245 Q120 288 34 245 Z"/>
    <line class="shaft" x1="120" y1="35" x2="120" y2="205"/>
    <path class="imp" d="M78 205 H162 L120 228 Z"/>
    <circle class="p" cx="72" cy="232" r="8"/><circle class="p" cx="110" cy="210" r="7"/><circle class="p" cx="155" cy="245" r="9"/><circle class="p" cx="165" cy="165" r="6"/>
    <text x="120" y="337" text-anchor="middle" class="t">частицы еще задерживаются у дна</text>
  </g>
  <g transform="translate(665 55)">
    <text x="120" y="0" text-anchor="middle" class="h">Полное суспендирование</text>
    <path class="tank" d="M30 35 H210 V250 Q120 300 30 250 Z"/>
    <path class="liq" d="M34 95 H206 V245 Q120 288 34 245 Z"/>
    <line class="shaft" x1="120" y1="35" x2="120" y2="205"/>
    <path class="imp" d="M78 205 H162 L120 228 Z"/>
    <circle class="p" cx="72" cy="215" r="7"/><circle class="p" cx="105" cy="170" r="8"/><circle class="p" cx="150" cy="230" r="7"/><circle class="p" cx="165" cy="140" r="6"/><circle class="p" cx="95" cy="120" r="6"/>
    <text x="120" y="337" text-anchor="middle" class="t">минимальная скорость полного отрыва</text>
  </g>
</svg>
