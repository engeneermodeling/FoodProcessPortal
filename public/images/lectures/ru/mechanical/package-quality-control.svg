<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Контроль якости пакованого продукту</title>
  <desc id="desc">Схема контролю: контрольна вага, герметичнисть, металодетектор або рентген, код партии и видбраковка.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Писля запаювання продукт ще не готовий до видвантаження</text>
  <g font-family="Arial, sans-serif">
    <rect x="76" y="172" width="120" height="84" rx="10" fill="#fbbf24" opacity=".85"/>
    <text x="96" y="154" fill="#fde68a" font-size="16" font-weight="700">пакет</text>
    <path d="M200 214h70" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="282" y="154" width="130" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="306" y="198" fill="#bbf7d0" font-size="18" font-weight="700">вага</text>
    <text x="302" y="224" fill="#cbd5e1" font-size="14">checkweigher</text>
    <path d="M416 214h70" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="498" y="154" width="130" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="524" y="198" fill="#bfdbfe" font-size="18" font-weight="700">инспекция</text>
    <text x="514" y="224" fill="#cbd5e1" font-size="14">метал / X-ray</text>
    <path d="M632 214h70" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="714" y="154" width="130" height="120" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="746" y="198" fill="#fecaca" font-size="18" font-weight="700">видбраковка</text>
    <text x="732" y="224" fill="#cbd5e1" font-size="14">повитряний штовхач</text>
  </g>
  <rect x="76" y="330" width="768" height="42" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="100" y="356" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15">Паковану одиницю перевиряють на масу, герметичнисть, сторонни предмети, код партии, дату и цилиснисть шва.</text>
</svg>
