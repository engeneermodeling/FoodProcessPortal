    <rect x="582" y="132" width="118" height="82" rx="14" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="616" y="166" fill="#dbeafe" font-weight="700">вода</text>
    <text x="610" y="190" fill="#bfdbfe">змив лугу</text>
