    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="460" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">CIP: повторюване миття без розбирання обладнання</text>
  <g font-family="Arial, sans-serif" font-size="15">
