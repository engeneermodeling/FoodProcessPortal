<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Типовий цикл CIP-миття</title>
  <desc id="desc">Схема послидовности очищення обладнання без розбирання: видалення залишкив, ополискування, луг, вода, кислота, вода, дезинфекция и контроль.</desc>
