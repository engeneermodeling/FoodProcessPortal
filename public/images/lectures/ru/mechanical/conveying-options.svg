<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Варианти транспортування сипких харчових материалив</title>
  <desc id="desc">Карта механичного и пневматичного транспорту: стричка, шнек, ковшовий елеватор, розриджена и щильна фаза.</desc>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Транспортер вибирають за материалом, не за звичкою</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="150" fill="#bfdbfe" font-size="18" font-weight="700">Стричковий</text>
    <text x="76" y="178" fill="#f8fafc" font-size="15">м'який, видкритий або закритий</text>
    <text x="76" y="200" fill="#94a3b8" font-size="14">зерно, овочи, паковани продукти</text>

    <rect x="335" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="150" fill="#fed7aa" font-size="18" font-weight="700">Шнековий</text>
    <text x="359" y="178" fill="#f8fafc" font-size="15">компактний, дозувальний</text>
    <text x="359" y="200" fill="#94a3b8" font-size="14">борошно, крупи, вологи маси</text>

    <rect x="618" y="116" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="150" fill="#bbf7d0" font-size="18" font-weight="700">Ковшовий елеватор</text>
    <text x="642" y="178" fill="#f8fafc" font-size="15">вертикальне пиднимання</text>
    <text x="642" y="200" fill="#94a3b8" font-size="14">зерно, насиння, гранули</text>

    <rect x="52" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="284" fill="#bae6fd" font-size="18" font-weight="700">Пневмо: розриджена фаза</text>
    <text x="76" y="312" fill="#f8fafc" font-size="15">частинки летять у потоци</text>
    <text x="76" y="334" fill="#94a3b8" font-size="14">просто, але бильше зношування</text>

    <rect x="335" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="284" fill="#ddd6fe" font-size="18" font-weight="700">Пневмо: щильна фаза</text>
    <text x="359" y="312" fill="#f8fafc" font-size="15">повильнише и м'якше</text>
    <text x="359" y="334" fill="#94a3b8" font-size="14">крихки гранули, агломерати</text>

    <rect x="618" y="250" width="250" height="92" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="284" fill="#fecaca" font-size="18" font-weight="700">Вибрацийний</text>
    <text x="642" y="312" fill="#f8fafc" font-size="15">мала видстань, дозування</text>
    <text x="642" y="334" fill="#94a3b8" font-size="14">тендитни або липки фракции</text>
  </g>
</svg>
