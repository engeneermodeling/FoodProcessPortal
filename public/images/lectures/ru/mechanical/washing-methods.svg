<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Методи миття харчовои сировини</title>
  <desc id="desc">Поривняння барабанного, флотацийного, щиткового та душового миття для ризнои сировини.</desc>
  <rect width="920" height="430" rx="22" fill="#0f172a"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Метод миття залежить вид форми и мицности сировини</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="152" fill="#bfdbfe" font-size="18" font-weight="700">Барабанне миття</text>
    <text x="76" y="180" fill="#f8fafc" font-size="15">тертя + обертання</text>
    <text x="76" y="202" fill="#94a3b8" font-size="14">картопля, коренеплоди</text>
    <rect x="335" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="152" fill="#bae6fd" font-size="18" font-weight="700">Флотацийне</text>
    <text x="359" y="180" fill="#f8fafc" font-size="15">вода + ризниця густини</text>
    <text x="359" y="202" fill="#94a3b8" font-size="14">листя, каминци, легки домишки</text>
    <rect x="618" y="118" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="152" fill="#bbf7d0" font-size="18" font-weight="700">Щиткове</text>
    <text x="642" y="180" fill="#f8fafc" font-size="15">механичне зняття грунту</text>
    <text x="642" y="202" fill="#94a3b8" font-size="14">овочи, тверди плоди</text>
    <rect x="52" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="76" y="288" fill="#fed7aa" font-size="18" font-weight="700">Душове</text>
    <text x="76" y="316" fill="#f8fafc" font-size="15">струмени води</text>
    <text x="76" y="338" fill="#94a3b8" font-size="14">деликатна сировина</text>
    <rect x="335" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="359" y="288" fill="#fecaca" font-size="18" font-weight="700">Повитряне очищення</text>
    <text x="359" y="316" fill="#f8fafc" font-size="15">аспирация, пил, лушпиння</text>
    <text x="359" y="338" fill="#94a3b8" font-size="14">зерно, насиння, специи</text>
    <rect x="618" y="254" width="250" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="642" y="288" fill="#ddd6fe" font-size="18" font-weight="700">Комбиноване</text>
    <text x="642" y="316" fill="#f8fafc" font-size="15">сухе + мокре + инспекция</text>
    <text x="642" y="338" fill="#94a3b8" font-size="14">пислязбиральни линии</text>
  </g>
</svg>
