<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Параметри ефективного миття</title>
  <desc id="desc">Схема чотирьох взаемопов'язаних факторив очищення: химия, температура, час и механична дия.</desc>
  <rect width="920" height="430" rx="22" fill="#111827"/>
  <text x="42" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Ефективнисть миття тримаеться на баланси параметрив</text>
  <g font-family="Arial, sans-serif">
    <circle cx="460" cy="230" r="80" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <text x="412" y="222" fill="#f8fafc" font-size="22" font-weight="700">чистота</text>
    <text x="394" y="250" fill="#cbd5e1" font-size="15">поверхни писля CIP</text>
    <g font-size="17" font-weight="700">
      <rect x="95" y="128" width="190" height="76" rx="14" fill="#854d0e" stroke="#f59e0b"/>
      <text x="138" y="160" fill="#fef3c7">химия</text>
      <text x="122" y="184" fill="#fde68a" font-size="14">луг, кислота, засиб</text>
      <rect x="635" y="128" width="190" height="76" rx="14" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="680" y="160" fill="#fee2e2">температура</text>
      <text x="674" y="184" fill="#fecaca" font-size="14">розчинення и реакции</text>
      <rect x="95" y="282" width="190" height="76" rx="14" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="158" y="314" fill="#dbeafe">час</text>
      <text x="126" y="338" fill="#bfdbfe" font-size="14">контакт из поверхнею</text>
      <rect x="635" y="282" width="190" height="76" rx="14" fill="#14532d" stroke="#22c55e"/>
      <text x="665" y="314" fill="#dcfce7">механика</text>
      <text x="660" y="338" fill="#bbf7d0" font-size="14">швидкисть, струминь</text>
    </g>
    <path d="M288 166c44 4 82 18 116 42" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path d="M632 166c-44 4-82 18-116 42" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path d="M288 320c44-4 82-18 116-42" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path d="M632 320c-44-4-82-18-116-42" fill="none" stroke="#38bdf8" stroke-width="5"/>
  </g>
</svg>
