<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Рабочая точка насоса</title>
  <desc id="desc">Пересечение падающей характеристики насоса H(Q) и возрастающей характеристики трубопровода определяет фактический расход и напор.</desc>
  <defs>
    <style>
      .bg{fill:#f8fbff}.axis{stroke:#102033;stroke-width:4}.grid{stroke:#d5e1f0;stroke-width:2}.pump{stroke:#2563eb;stroke-width:6;fill:none}.pipe{stroke:#e07a1f;stroke-width:6;fill:none}.zone{fill:#c7f0d8;opacity:.55}.pt{fill:#d62828}.txt{font-family:Arial,"Helvetica Neue",sans-serif;fill:#102033;font-size:23px}.head{font-size:31px;font-weight:700;fill:#0f2a4f}.label{font-size:25px;font-weight:700}.small{font-size:19px;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1040" height="620"/>
  <text class="txt head" x="520" y="50" text-anchor="middle">Рабочая точка: насос + трубопровод</text>
  <g transform="translate(120 95)">
    <line class="grid" x1="0" y1="80" x2="760" y2="80"/><line class="grid" x1="0" y1="160" x2="760" y2="160"/><line class="grid" x1="0" y1="240" x2="760" y2="240"/><line class="grid" x1="0" y1="320" x2="760" y2="320"/><line class="grid" x1="0" y1="400" x2="760" y2="400"/>
    <line class="grid" x1="160" y1="0" x2="160" y2="440"/><line class="grid" x1="320" y1="0" x2="320" y2="440"/><line class="grid" x1="480" y1="0" x2="480" y2="440"/><line class="grid" x1="640" y1="0" x2="640" y2="440"/>
    <rect class="zone" x="330" y="145" width="170" height="120" rx="14"/>
    <path class="pump" d="M40 85 C205 105 365 150 520 240 C610 295 690 355 740 415"/>
    <path class="pipe" d="M40 365 C190 350 330 305 470 220 C570 160 655 105 740 75"/>
    <circle class="pt" cx="455" cy="230" r="12"/>
    <line class="axis" x1="0" y1="440" x2="790" y2="440"/>
    <line class="axis" x1="0" y1="440" x2="0" y2="0"/>
    <text class="txt label" x="800" y="448">Q</text>
    <text class="txt label" x="-35" y="20">H</text>
    <text class="txt label" x="128" y="115" fill="#2563eb">характеристика насоса H(Q)</text>
    <text class="txt label" x="495" y="105" fill="#b45309">трубопровод Hтр(Q)</text>
    <text class="txt label" x="475" y="248">рабочая точка</text>
    <text class="txt small" x="343" y="286">зона лучшего КПД</text>
  </g>
  <text class="txt small" x="520" y="585" text-anchor="middle">Задвижка, фильтр, диаметр трубы или частотник меняют кривую трубопровода или насоса, а вместе с ними фактический расход.</text>
</svg>
